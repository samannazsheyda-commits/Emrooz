name: Build Emrooz v2.0.3 Hybrid Speech

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-v203-hybrid.yml'

jobs:
  build-and-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct exact RNNT base source
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/transfer.b64
          for i in $(seq 0 27); do printf -v p '%03d' "$i"; cat "payload/v201.part${p}" >> /tmp/transfer.b64; done
          cat payload/v201.part028.a payload/v201.part028.b payload/v201.part028.c payload/v201.part028.d >> /tmp/transfer.b64
          for i in $(seq 29 40); do printf -v p '%03d' "$i"; cat "payload/v201.part${p}" >> /tmp/transfer.b64; done
          tr -d '\r\n' < /tmp/transfer.b64 | base64 -d > /tmp/transfer.tar.xz
          echo '8ee6d03b5243d4818d65daaec44fae8d713231a8e6bf1f51bc4eeafae2db210b  /tmp/transfer.tar.xz' | sha256sum -c -
          rm -rf /tmp/emrooz
          mkdir -p /tmp/emrooz
          tar -xJf /tmp/transfer.tar.xz -C /tmp/emrooz
          test -f /tmp/emrooz/app/build.gradle.kts

      - name: Install QA image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep python3-pil

      - name: Apply approved UI and v2.0.3 hybrid speech overlay
        shell: bash
        working-directory: /tmp/emrooz
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"

          cp "$ROOT/approved_ui/Theme.kt" app/src/main/java/com/nameemrooz/journal/ui/theme/Theme.kt
          cp "$ROOT/approved_ui/AppViewModel.kt" app/src/main/java/com/nameemrooz/journal/ui/AppViewModel.kt
          cp "$ROOT/approved_ui/BiometricGate.kt" app/src/main/java/com/nameemrooz/journal/privacy/BiometricGate.kt
          cp "$ROOT/approved_ui/MainActivity.kt" app/src/main/java/com/nameemrooz/journal/MainActivity.kt

          cp "$ROOT/hybrid_v203/build.gradle.kts" app/build.gradle.kts
          cp "$ROOT/hybrid_v203/AndroidManifest.xml" app/src/main/AndroidManifest.xml
          cp "$ROOT/hybrid_v203/SettingsStore.kt" app/src/main/java/com/nameemrooz/journal/data/SettingsStore.kt

          for f in SpeechMode.kt SpeechEngine.kt SystemSpeechErrorPolicy.kt SystemSpeechEngine.kt TranscriptContinuity.kt HybridSpeechController.kt LiveSpeechEngine.kt; do
            cp "$ROOT/hybrid_v203/$f" "app/src/main/java/com/nameemrooz/journal/speech/$f"
          done
          mkdir -p app/src/main/java/com/nameemrooz/journal/writing
          for f in PunctuationRestorer.kt LexicalSafety.kt TextEditor.kt StableDisplayComposer.kt LocalPunctuationModel.kt; do
            cp "$ROOT/hybrid_v203/$f" "app/src/main/java/com/nameemrooz/journal/writing/$f"
          done

          cat "$ROOT/hybrid_v203/NameEmroozApp.part00" \
              "$ROOT/hybrid_v203/NameEmroozApp.part01" \
              "$ROOT/hybrid_v203/NameEmroozApp.part02" \
              "$ROOT/hybrid_v203/NameEmroozApp.part03" \
              "$ROOT/hybrid_v203/NameEmroozApp.part04" \
              > app/src/main/java/com/nameemrooz/journal/ui/NameEmroozApp.kt
          echo '0458d898e9be5d7bdd0010ab579d3d81cfa236a6610da7c257026949de1cba01  app/src/main/java/com/nameemrooz/journal/ui/NameEmroozApp.kt' | sha256sum -c -

          mkdir -p app/src/test/java/com/nameemrooz/journal/speech app/src/test/java/com/nameemrooz/journal/writing
          cp "$ROOT/hybrid_v203/SpeechModePolicyTest.kt" app/src/test/java/com/nameemrooz/journal/speech/
          cp "$ROOT/hybrid_v203/TranscriptContinuityTest.kt" app/src/test/java/com/nameemrooz/journal/speech/
          cp "$ROOT/hybrid_v203/TextEditorSafetyTest.kt" app/src/test/java/com/nameemrooz/journal/writing/
          cp "$ROOT/hybrid_v203/StableDisplayComposerTest.kt" app/src/test/java/com/nameemrooz/journal/writing/
          cp "$ROOT/approved_ui/verify_approved_ui_contract.sh" tools/verify_approved_ui_contract.sh
          cp "$ROOT/hybrid_v203/verify_hybrid_speech_contract.sh" tools/verify_hybrid_speech_contract.sh
          chmod +x tools/verify_approved_ui_contract.sh tools/verify_hybrid_speech_contract.sh

          base64 -d "$ROOT/approved_ui/app_icon.b64" > /tmp/approved_icon.png
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          icon = Image.open('/tmp/approved_icon.png').convert('RGBA')
          cream=(247,242,234,255)
          for density,size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              canvas=Image.new('RGBA',(256,256),cream)
              ref=icon.copy(); ref.thumbnail((182,256),Image.Resampling.LANCZOS)
              canvas.alpha_composite(ref,((256-ref.width)//2,(256-ref.height)//2))
              out=canvas.resize((size,size),Image.Resampling.LANCZOS)
              p=Path(f'app/src/main/res/mipmap-{density}'); p.mkdir(parents=True,exist_ok=True)
              out.convert('RGB').save(p/'ic_launcher.png')
              out.convert('RGB').save(p/'ic_launcher_round.png')

          px=icon.load()
          for y in range(icon.height):
              for x in range(icon.width):
                  r,g,b,a=px[x,y]
                  if abs(r-247)<20 and abs(g-242)<20 and abs(b-234)<20:
                      px[x,y]=(r,g,b,0)
          bbox=icon.getbbox(); fg=icon.crop(bbox) if bbox else icon
          fg.thumbnail((230,320),Image.Resampling.LANCZOS)
          canvas=Image.new('RGBA',(432,432),(0,0,0,0))
          canvas.alpha_composite(fg,((432-fg.width)//2,(432-fg.height)//2))
          Path('app/src/main/res/drawable-nodpi').mkdir(parents=True,exist_ok=True)
          canvas.save('app/src/main/res/drawable-nodpi/ic_launcher_foreground_png.png')

          for mode in ('light','dark'):
              d=Path('app/src/main/res/drawable-nodpi')
              png=d/f'splash_emrooz_{mode}.png'
              webp=d/f'splash_emrooz_{mode}.webp'
              if not png.exists():
                  if not webp.exists(): raise SystemExit(f'missing approved {mode} splash')
                  Image.open(webp).convert('RGB').save(png, format='PNG')
              if webp.exists(): webp.unlink()
          PY

          mkdir -p app/src/main/res/mipmap-anydpi-v26 app/src/main/res/values
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground_png" />
          </adaptive-icon>
          EOF
          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources><color name="ic_launcher_background">#F7F2EA</color></resources>
          EOF
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="Theme.NameEmrooz" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:windowLightNavigationBar">true</item>
                  <item name="android:navigationBarColor">#F7F2EA</item>
                  <item name="android:statusBarColor">#F7F2EA</item>
                  <item name="android:windowBackground">#F7F2EA</item>
              </style>
          </resources>
          EOF

          grep -q 'versionCode = 33' app/build.gradle.kts
          grep -q 'versionName = "2.0.3"' app/build.gradle.kts
          grep -q 'JavaVersion.VERSION_17' app/build.gradle.kts
          grep -q 'room-compiler:2.8.5' app/build.gradle.kts
          grep -q 'androidx.work.WorkManagerInitializer' app/src/main/AndroidManifest.xml
          grep -q 'tools:node="remove"' app/src/main/AndroidManifest.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: QA source contracts
        shell: bash
        working-directory: /tmp/emrooz
        run: |
          set -euo pipefail
          bash tools/verify_approved_ui_contract.sh
          bash tools/verify_hybrid_speech_contract.sh
          bash tools/test_shenava_rnnt_contract.sh
          bash tools/verify_live_engine_contract.sh
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          ! grep -R -Eqi 'FileOutputStream|AudioRecord.*write|\.wav|\.pcm|setOutputFile' app/src/main/java/com/nameemrooz/journal/speech

      - name: QA unit tests lint and arm64 release build
        shell: bash
        working-directory: /tmp/emrooz
        run: |
          set -euo pipefail
          gradle --no-daemon clean :app:testDebugUnitTest :app:lintRelease :app:assembleRelease

      - name: Sign release APK
        shell: bash
        working-directory: /tmp/emrooz
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$UNSIGNED"
          mkdir -p /tmp/out
          keytool -genkeypair -noprompt -keystore /tmp/emrooz-v203.jks -storepass emroozrelease -keypass emroozrelease -alias emrooz -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Emrooz,O=Emrooz,C=DE'
          "$BT/zipalign" -f 4 "$UNSIGNED" /tmp/out/aligned.apk
          "$BT/apksigner" sign --ks /tmp/emrooz-v203.jks --ks-pass pass:emroozrelease --key-pass pass:emroozrelease --out /tmp/out/Emrooz-v2.0.3-Hybrid-FA-EN-arm64.apk /tmp/out/aligned.apk
          rm -f /tmp/out/aligned.apk

      - name: QA release APK integrity and model assets
        shell: bash
        working-directory: /tmp/emrooz
        run: |
          set -euo pipefail
          APK=/tmp/out/Emrooz-v2.0.3-Hybrid-FA-EN-arm64.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -c -v 4 "$APK" >/tmp/out/zipalign.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK" >/tmp/out/signature.txt
          "$BT/aapt" dump badging "$APK" >/tmp/out/badging.txt
          "$BT/aapt" dump permissions "$APK" >/tmp/out/permissions.txt
          unzip -t "$APK" >/tmp/out/ziptest.txt

          grep -q "package: name='com.nameemrooz.journal' versionCode='33' versionName='2.0.3'" /tmp/out/badging.txt
          grep -q "sdkVersion:'26'" /tmp/out/badging.txt
          grep -q "targetSdkVersion:'35'" /tmp/out/badging.txt
          ! grep -q 'android.permission.INTERNET' /tmp/out/permissions.txt
          test "$(unzip -Z1 "$APK" | grep '^lib/' | cut -d/ -f2 | sort -u | tr '\n' ' ')" = 'arm64-v8a '

          unzip -p "$APK" assets/models/shenava_v15_rnnt_int8/encoder.int8.onnx >/tmp/encoder.onnx
          unzip -p "$APK" assets/models/shenava_v15_rnnt_int8/decoder.int8.onnx >/tmp/decoder.onnx
          unzip -p "$APK" assets/models/shenava_v15_rnnt_int8/joiner.int8.onnx >/tmp/joiner.onnx
          unzip -p "$APK" assets/models/shenava_v15_rnnt_int8/tokens.txt >/tmp/tokens.txt
          echo 'b9d975c1af77002f83897017e3adaaa6510148c6ba332df92b8d281369f2fdd3  /tmp/encoder.onnx' | sha256sum -c -
          echo '0adaad326a536dfbb30c67287e909b4e6f0775fccb8c3ca47270890364824947  /tmp/decoder.onnx' | sha256sum -c -
          echo 'e441ed265c961ff4a2436aa8bc36638e65849445e7a1f65cf263f0c310593dde  /tmp/joiner.onnx' | sha256sum -c -
          echo '8e192963f6e666dfa5721e5cbd4710bc1ef592460a45f08cefc94b2db16a6954  /tmp/tokens.txt' | sha256sum -c -

          unzip -p "$APK" assets/models/punctuation47/punct_cap_seg_47lang.onnx >/tmp/punctuation.onnx
          unzip -p "$APK" assets/models/punctuation47/spe_unigram_64k_lowercase_47lang.model >/tmp/punctuation-tokenizer.model
          echo '640d91c06b7cc5b3e065c12a7097188378aad3bc11568ff1d72c4c0a2acb0df4  /tmp/punctuation.onnx' | sha256sum -c -
          test "$(stat -c '%s' /tmp/punctuation-tokenizer.model)" -gt 500000

          APK_SHA=$(sha256sum "$APK" | awk '{print $1}')
          APK_SIZE=$(stat -c '%s' "$APK")
          printf '%s\n' "$APK_SHA" > /tmp/out/apk-sha256.txt
          printf '%s\n' "$APK_SIZE" > /tmp/out/apk-size.txt

      - name: Build x86_64 debug APK for runtime smoke
        shell: bash
        working-directory: /tmp/emrooz
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle.kts')
          s=p.read_text()
          old='abiFilters += listOf("arm64-v8a")'
          assert old in s
          p.write_text(s.replace(old, 'abiFilters += listOf("x86_64")', 1))
          PY
          gradle --no-daemon :app:assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: QA real Android launch smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            mkdir -p /tmp/out
            adb install -r /tmp/emrooz/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.nameemrooz.journal || true
            adb shell monkey -p com.nameemrooz.journal -c android.intent.category.LAUNCHER 1
            sleep 12
            PID="$(adb shell pidof com.nameemrooz.journal | tr -d '\r')"
            test -n "$PID"
            echo "process_alive=$PID" | tee /tmp/out/runtime-proof.txt
            adb exec-out screencap -p > /tmp/out/runtime-launch.png
            adb logcat -d > /tmp/out/runtime-logcat.txt
            if grep -A35 'FATAL EXCEPTION' /tmp/out/runtime-logcat.txt | grep -q 'com.nameemrooz.journal'; then
              echo 'FATAL EXCEPTION found for Emrooz' >&2
              exit 1
            fi
            if grep -q 'Process: com.nameemrooz.journal.*has died' /tmp/out/runtime-logcat.txt; then
              echo 'Emrooz process died after launch' >&2
              exit 1
            fi

      - name: Write final QA report
        shell: bash
        working-directory: /tmp/emrooz
        run: |
          set -euo pipefail
          APK=/tmp/out/Emrooz-v2.0.3-Hybrid-FA-EN-arm64.apk
          APK_SHA=$(cat /tmp/out/apk-sha256.txt)
          APK_SIZE=$(cat /tmp/out/apk-size.txt)
          CERT=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/out/signature.txt | sed 's/.*digest: //')
          cat > /tmp/out/Emrooz-v2.0.3-QA-FA.md <<EOF
          # گزارش QA نهایی Emrooz v2.0.3

          1. PASS — UI تأییدشده با Abar/Lato، تم روشن/تیره، Glow زنده و آرشیو بدون عنوان.
          2. PASS — Shenava v1.5 RNNT آفلاین به‌عنوان مسیر اصلی/فالبک و System Speech به‌عنوان حالت اختیاری دقت بیشتر.
          3. PASS — حفظ متن در fallback و تست‌های policy/continuity پاس شدند.
          4. PASS — ویراستار محافظه‌کار و Lexical Safety مانع تغییر واژه‌های کاربر می‌شوند.
          5. PASS — مدل نقطه‌گذاری محلی ONNX و tokenizer داخل APK بسته‌بندی و مدل با SHA-256 دقیق تأیید شد.
          6. PASS — هیچ INTERNET permission در خود اپ نیست و مسیر Shenava هیچ فایل صوتی ذخیره نمی‌کند.
          7. PASS — unit tests، lintRelease و assembleRelease پاس شدند.
          8. PASS — package/version/minSdk/targetSdk و arm64-v8a-only تأیید شدند.
          9. PASS — ZIP/zipalign و امضای APK با apksigner تأیید شدند.
          10. PASS — APK دیباگ روی Android 35 Emulator نصب و اجرا شد؛ پردازش زنده ماند و FATAL EXCEPTION برای اپ دیده نشد.

          APK SHA-256: $APK_SHA
          APK size: $APK_SIZE bytes
          Signing certificate SHA-256: $CERT
          EOF
          cat /tmp/out/Emrooz-v2.0.3-QA-FA.md

      - name: Upload final APK and QA proofs
        uses: actions/upload-artifact@v4
        with:
          name: Emrooz-v2.0.3-Hybrid-Final
          path: |
            /tmp/out/Emrooz-v2.0.3-Hybrid-FA-EN-arm64.apk
            /tmp/out/Emrooz-v2.0.3-QA-FA.md
            /tmp/out/runtime-proof.txt
            /tmp/out/runtime-launch.png
            /tmp/out/runtime-logcat.txt
            /tmp/out/apk-sha256.txt
            /tmp/out/apk-size.txt
          if-no-files-found: error
          retention-days: 30
