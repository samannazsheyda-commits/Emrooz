name: Read Emrooz Android diagnostics
on:
  push:
    branches: ['work/emrooz-complete-*']
    paths: ['.github/workflows/emrooz-read-diagnostics.yml']
  pull_request:
    paths: ['.github/workflows/emrooz-read-diagnostics.yml']
permissions:
  contents: read
  actions: read
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Emrooz-2.3.0-api-26-preview-and-verification
          run-id: 41296270138
          github-token: ${{ github.token }}
          path: diag
      - name: Print bounded Android diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('diag/out/android-logcat.txt')
          print('LOGCAT_EXISTS',p.exists())
          if p.exists():
              lines=p.read_text(errors='replace').splitlines()
              pattern=re.compile(r'FATAL EXCEPTION|AndroidRuntime|INSTRUMENTATION|AndroidJUnit|TestRunner|TestExecutor|NoSuchMethod|NoClassDef|ClassNotFound|SecurityException|Permission Denial|Permission denied|Instrumentation|has died|Process crashed|am_crash|Unable to instantiate|am_anr|grpc|Socket|com.nameemrooz.journal',re.I)
              selected=[x for x in lines if pattern.search(x)]
              print('\n'.join(selected[:100]+selected[-400:]))
          for name in ['release-launch.txt','release-process.txt','android-activities.txt','android-memory.txt']:
              p=Path('diag/out')/name
              print('FILE',name,p.exists())
              if p.exists(): print(p.read_text(errors='replace')[-10000:])
          for p in Path('diag/app/build/outputs/androidTest-results').rglob('*.xml'):
              print('TEST_XML',p)
              print(p.read_text(errors='replace')[-10000:])
          PY
