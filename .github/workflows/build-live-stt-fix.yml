name: Build Emrooz Editor + Names

on:
  push:
    branches: [ fix/editor-names-v112 ]
    paths:
      - 'fixes/**'
      - '.github/workflows/build-live-stt-fix.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Android source and overlay fixes
        shell: bash
        run: |
          set -euo pipefail
          cat payload/v110.part* | base64 -d > /tmp/emrooz-source.tar.gz
          echo "3c0dfc2159467bf457f7235a8377dde233acebd637b68e6717836b4ebcdd5bee  /tmp/emrooz-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/emrooz-source.tar.gz -C .
          UI="app/src/main/java/com/nameemrooz/journal/ui/NameEmroozApp.kt"
          sed -i '/^import androidx\.compose\.foundation\.layout\.matchParentSize$/d' "$UI"
          sed -i '/^import androidx\.compose\.foundation\.layout\.weight$/d' "$UI"
          if [ -d fixes/app ]; then cp -a fixes/app/. app/; fi
          python3 fixes/apply_ui_patch.py
          grep -q 'transcriptionGlow' "$UI"
          grep -q 'در حال تبدیل صدا به متن' "$UI"
          grep -q 'noto_naskh_arabic' "$UI"
          grep -q 'vazirmatn_semibold' "$UI"
          sed -i 's/versionCode = 13/versionCode = 15/' app/build.gradle.kts || true
          sed -i 's/versionName = "1.1.0"/versionName = "1.1.2"/' app/build.gradle.kts
          grep -q 'versionName = "1.1.2"' app/build.gradle.kts

      - name: Bundle pinned Persian fonts and offline name lexicon
        shell: bash
        run: |
          set -euo pipefail
          FONT_DIR="app/src/main/res/font"
          LEX_DIR="app/src/main/assets/lexicon"
          mkdir -p "$FONT_DIR" "$LEX_DIR"

          curl -L --fail --retry 5 --retry-all-errors --connect-timeout 30 \
            -o "$FONT_DIR/noto_naskh_arabic.ttf" \
            'https://raw.githubusercontent.com/google/fonts/ade3d1533e06b2b1462ffcde8e08b129627ca360/ofl/notonaskharabic/NotoNaskhArabic%5Bwght%5D.ttf'
          curl -L --fail --retry 5 --retry-all-errors --connect-timeout 30 \
            -o "$FONT_DIR/vazirmatn_regular.ttf" \
            'https://raw.githubusercontent.com/rastikerdar/vazirmatn/6e553e33489a8f9dfaccc76860a2e3f3c1e66de7/fonts/ttf/Vazirmatn-Regular.ttf'
          curl -L --fail --retry 5 --retry-all-errors --connect-timeout 30 \
            -o "$FONT_DIR/vazirmatn_semibold.ttf" \
            'https://raw.githubusercontent.com/rastikerdar/vazirmatn/6e553e33489a8f9dfaccc76860a2e3f3c1e66de7/fonts/ttf/Vazirmatn-SemiBold.ttf'

          curl -L --fail --retry 5 --retry-all-errors --connect-timeout 30 \
            -o /tmp/persian_first_names.json \
            'https://raw.githubusercontent.com/nabidam/persian-names/68f5cb39a25c19ecaf6f60f3181aea200f8206f8/names.json'
          curl -L --fail --retry 5 --retry-all-errors --connect-timeout 30 \
            -o /tmp/persian_surnames.csv \
            'https://raw.githubusercontent.com/farbodbj/iranian-surname-frequencies/9fb2fdccb62445b52e933d4d7929a52e01bd6011/iranian-surname-frequencies.csv'

          python3 - <<'PY'
          import csv
          import json
          from pathlib import Path

          def norm(value: str) -> str:
              return (value or '').strip().replace('ي','ی').replace('ى','ی').replace('ك','ک').replace('ة','ه')

          lex = Path('app/src/main/assets/lexicon')
          data = json.loads(Path('/tmp/persian_first_names.json').read_text(encoding='utf-8-sig'))
          first_names = {norm(k) for k in data.keys() if norm(k)}
          first_names.add('سهیل')
          (lex / 'persian_first_names.txt').write_text('\n'.join(sorted(first_names)) + '\n', encoding='utf-8')

          surnames = {}
          with open('/tmp/persian_surnames.csv', encoding='utf-8-sig', newline='') as f:
              for row in csv.DictReader(f):
                  name = norm(row.get('name', ''))
                  if not name:
                      continue
                  try:
                      freq = float(row.get('frequency', 0) or 0)
                  except ValueError:
                      freq = 0.0
                  score = max(1, int(round(freq * 1_000_000_000)))
                  surnames[name] = max(surnames.get(name, 0), score)
          surnames['ممدوحی'] = max(surnames.get('ممدوحی', 0), 1)
          with (lex / 'persian_surnames.tsv').open('w', encoding='utf-8') as f:
              for name, score in sorted(surnames.items()):
                  f.write(f'{name}\t{score}\n')
          PY

          test -s "$FONT_DIR/noto_naskh_arabic.ttf"
          test -s "$FONT_DIR/vazirmatn_regular.ttf"
          test -s "$FONT_DIR/vazirmatn_semibold.ttf"
          grep -Fxq 'سهیل' "$LEX_DIR/persian_first_names.txt"
          grep -q $'^ممدوحی\t' "$LEX_DIR/persian_surnames.tsv"
          test "$(wc -l < "$LEX_DIR/persian_first_names.txt")" -gt 1000
          test "$(wc -l < "$LEX_DIR/persian_surnames.tsv")" -gt 50000

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate temporary CI signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../signing
          keytool -genkeypair -v \
            -keystore ../signing/emrooz-release.jks \
            -storepass Emrooz2026Release \
            -alias emrooz \
            -keypass Emrooz2026Release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Emrooz, OU=Android, O=Emrooz, C=IR"

      - name: Download pinned streaming INT8 Persian model
        shell: bash
        run: |
          set -euo pipefail
          MODEL_DIR="app/src/main/assets/models/shenava_v10_ctc"
          mkdir -p "$MODEL_DIR"
          MODEL_URL="https://huggingface.co/mah92/sherpa-onnx-nemo-ctc-fa-shenava-koochik-v1.0-streaming-int8-2026-06-26/resolve/ae7a6e0f530d30f3a110e26724dca4efce01a85e/model.int8.onnx?download=true"
          TOKENS_URL="https://huggingface.co/mah92/sherpa-onnx-nemo-ctc-fa-shenava-koochik-v1.0-streaming-int8-2026-06-26/resolve/ae7a6e0f530d30f3a110e26724dca4efce01a85e/tokens.txt?download=true"
          curl -L --fail --retry 5 --retry-all-errors --connect-timeout 30 -o "$MODEL_DIR/model.onnx" "$MODEL_URL"
          curl -L --fail --retry 5 --retry-all-errors --connect-timeout 30 -o "$MODEL_DIR/tokens.txt" "$TOKENS_URL"
          echo "439983c95ab83c55c841e0795ba3a61d56718ec5c972a3a208548b93470b04b1  $MODEL_DIR/model.onnx" | sha256sum -c -

      - name: Run regression tests
        shell: bash
        run: gradle --no-daemon --stacktrace :app:testReleaseUnitTest

      - name: Build release APK
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep 'assets/models/shenava_v10_ctc/model.onnx'
          unzip -l "$APK" | grep 'assets/lexicon/persian_first_names.txt'
          unzip -l "$APK" | grep 'assets/lexicon/persian_surnames.tsv'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libsherpa-onnx-jni.so'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee /tmp/perms.txt
          grep -q 'android.permission.RECORD_AUDIO' /tmp/perms.txt
          ! grep -q 'android.permission.INTERNET' /tmp/perms.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionName='1.1.2'" /tmp/badging.txt
          cp "$APK" Emrooz-Final-v1.1.2-EditorNames.apk
          sha256sum Emrooz-Final-v1.1.2-EditorNames.apk > Emrooz-Final-v1.1.2-EditorNames.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Emrooz-Final-v1.1.2-EditorNames
          path: |
            Emrooz-Final-v1.1.2-EditorNames.apk
            Emrooz-Final-v1.1.2-EditorNames.apk.sha256
          compression-level: 0
          retention-days: 30