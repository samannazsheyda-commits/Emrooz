name: Verify Emrooz v2.0.3 Hybrid Compile

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-v203-compile.yml'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact base
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/transfer.b64
          for i in $(seq 0 27); do printf -v p '%03d' "$i"; cat "payload/v201.part${p}" >> /tmp/transfer.b64; done
          cat payload/v201.part028.a payload/v201.part028.b payload/v201.part028.c payload/v201.part028.d >> /tmp/transfer.b64
          for i in $(seq 29 40); do printf -v p '%03d' "$i"; cat "payload/v201.part${p}" >> /tmp/transfer.b64; done
          tr -d '\r\n' < /tmp/transfer.b64 | base64 -d > /tmp/transfer.tar.xz
          echo '8ee6d03b5243d4818d65daaec44fae8d713231a8e6bf1f51bc4eeafae2db210b  /tmp/transfer.tar.xz' | sha256sum -c -
          rm -rf /tmp/emrooz && mkdir -p /tmp/emrooz
          tar -xJf /tmp/transfer.tar.xz -C /tmp/emrooz

      - name: Overlay approved UI and hybrid source
        shell: bash
        working-directory: /tmp/emrooz
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          cp "$ROOT/approved_ui/Theme.kt" app/src/main/java/com/nameemrooz/journal/ui/theme/Theme.kt
          cp "$ROOT/approved_ui/AppViewModel.kt" app/src/main/java/com/nameemrooz/journal/ui/AppViewModel.kt
          cp "$ROOT/approved_ui/BiometricGate.kt" app/src/main/java/com/nameemrooz/journal/privacy/BiometricGate.kt
          cp "$ROOT/approved_ui/MainActivity.kt" app/src/main/java/com/nameemrooz/journal/MainActivity.kt
          cp "$ROOT/hybrid_v203/build.gradle.kts" app/build.gradle.kts
          cp "$ROOT/hybrid_v203/AndroidManifest.xml" app/src/main/AndroidManifest.xml
          cp "$ROOT/hybrid_v203/SettingsStore.kt" app/src/main/java/com/nameemrooz/journal/data/SettingsStore.kt
          cp "$ROOT/hybrid_v203/JalaliDate.kt" app/src/main/java/com/nameemrooz/journal/util/JalaliDate.kt
          for f in SpeechMode.kt SpeechEngine.kt SystemSpeechErrorPolicy.kt SystemSpeechEngine.kt TranscriptContinuity.kt HybridSpeechController.kt LiveSpeechEngine.kt; do
            cp "$ROOT/hybrid_v203/$f" "app/src/main/java/com/nameemrooz/journal/speech/$f"
          done
          mkdir -p app/src/main/java/com/nameemrooz/journal/writing
          for f in PunctuationRestorer.kt LexicalSafety.kt TextEditor.kt StableDisplayComposer.kt LocalPunctuationModel.kt; do
            cp "$ROOT/hybrid_v203/$f" "app/src/main/java/com/nameemrooz/journal/writing/$f"
          done
          cat "$ROOT/hybrid_v203/NameEmroozApp.part00" "$ROOT/hybrid_v203/NameEmroozApp.part01" "$ROOT/hybrid_v203/NameEmroozApp.part02" "$ROOT/hybrid_v203/NameEmroozApp.part03" "$ROOT/hybrid_v203/NameEmroozApp.part04" > app/src/main/java/com/nameemrooz/journal/ui/NameEmroozApp.kt
          mkdir -p app/src/test/java/com/nameemrooz/journal/speech app/src/test/java/com/nameemrooz/journal/writing
          cp "$ROOT/hybrid_v203/SpeechModePolicyTest.kt" app/src/test/java/com/nameemrooz/journal/speech/
          cp "$ROOT/hybrid_v203/TranscriptContinuityTest.kt" app/src/test/java/com/nameemrooz/journal/speech/
          cp "$ROOT/hybrid_v203/TextEditorSafetyTest.kt" app/src/test/java/com/nameemrooz/journal/writing/
          cp "$ROOT/hybrid_v203/StableDisplayComposerTest.kt" app/src/test/java/com/nameemrooz/journal/writing/
          cp "$ROOT/hybrid_v203/verify_hybrid_speech_contract.sh" tools/verify_hybrid_speech_contract.sh
          chmod +x tools/verify_hybrid_speech_contract.sh
          bash tools/verify_hybrid_speech_contract.sh
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          ! grep -R -Eqi 'FileOutputStream|AudioRecord.*write|\.wav|\.pcm|setOutputFile' app/src/main/java/com/nameemrooz/journal/speech

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unit tests and compile
        working-directory: /tmp/emrooz
        run: gradle --no-daemon clean :app:testDebugUnitTest :app:compileDebugKotlin
