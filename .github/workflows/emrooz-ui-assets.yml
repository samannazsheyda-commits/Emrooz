name: Emrooz viewport regression and store assets
on:
  push:
    branches: ['work/emrooz-ui-fix-*']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: emrooz-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Reuse verified punctuation assets from the prior successful build
        uses: actions/download-artifact@v4
        with:
          name: Emrooz-2.3.1-api-35-preview-and-verification
          run-id: 41304834289
          github-token: ${{ github.token }}
          path: prior-build
      - name: Extract checksum-verified model files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          apk = next(Path('prior-build').rglob('*.apk'))
          with zipfile.ZipFile(apk) as z:
              for name in z.namelist():
                  if name.startswith('assets/models/punctuation47/') and not name.endswith('/'):
                      p = Path('app/src/main') / name
                      p.parent.mkdir(parents=True, exist_ok=True)
                      p.write_bytes(z.read(name))
          PY
      - name: Compile regression instrumentation
        run: gradle --no-daemon -PemroozPreview -PemroozAbi=x86_64 :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real keyboard and viewport regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 1
            gradle --no-daemon -Dorg.gradle.jvmargs='-Xmx1536m -Dfile.encoding=UTF-8' -PemroozPreview -PemroozAbi=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=com.nameemrooz.journal.JournalViewportTest :app:connectedDebugAndroidTest
      - name: Print regression results
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('app/build/outputs/androidTest-results').rglob('*.xml'):
              print(p.read_text()[:20000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Emrooz-viewport-regression
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 30
