name: Emrooz viewport regression and store assets
on:
  push:
    branches: ['work/emrooz-ui-fix-*']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: emrooz-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false
      - name: Reuse verified punctuation assets from the prior successful build
        uses: actions/download-artifact@v4
        with:
          name: Emrooz-2.3.1-api-35-preview-and-verification
          run-id: 41304834289
          github-token: ${{ github.token }}
          path: prior-build
      - name: Extract checksum-verified model files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          apk = next(Path('prior-build').rglob('*.apk'))
          with zipfile.ZipFile(apk) as z:
              for name in z.namelist():
                  if name.startswith('assets/models/punctuation47/') and not name.endswith('/'):
                      p = Path('app/src/main') / name
                      p.parent.mkdir(parents=True, exist_ok=True)
                      p.write_bytes(z.read(name))
          PY
      - name: Unit tests, lint and production arm64 build
        if: matrix.api == 35
        run: |
          python3 -m unittest discover -s tools/tests -v
          gradle --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
          mkdir -p out
          cp -r app/build/reports/tests out/jvm-tests
          cp app/build/reports/lint-results-release.* out/
          cp app/build/outputs/apk/release/app-release-unsigned.apk out/Emrooz-2.3.2-CafeBazaar-unsigned-arm64.apk
          python3 tools/verify-apk.py out/Emrooz-2.3.2-CafeBazaar-unsigned-arm64.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -P 16 -c 4 out/Emrooz-2.3.2-CafeBazaar-unsigned-arm64.apk
          gradle --no-daemon -PemroozPreview -PemroozPreviewApplicationId=com.nameemrooz.journal.preview.hotfix :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk out/Emrooz-2.3.2-Update-CI-arm64.apk
          python3 tools/verify-apk.py out/Emrooz-2.3.2-Update-CI-arm64.apk
      - name: Compile instrumentation APKs
        run: gradle --no-daemon -PemroozPreview -PemroozAbi=x86_64 :app:clean :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real keyboard, journal regressions and actual UI screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072
          script: EMROOZ_SKIP_CAPTURE=${{ matrix.api == 26 && '1' || '0' }} bash tools/android-viewport-check.sh
      - name: Verify actual screenshot backgrounds and dimensions
        if: matrix.api == 35
        run: |
          python3 -m pip install Pillow==11.3.0
          python3 tools/verify-store-shots.py out/screenshots
      - name: Print regression results
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('app/build/outputs/androidTest-results').rglob('*.xml'):
              print(p.read_text()[:20000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Emrooz-2.3.2-viewport-api-${{ matrix.api }}
          path: |
            out/
            app/build/reports/tests/
            app/build/reports/lint-results-release.*
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 30
          compression-level: 0
