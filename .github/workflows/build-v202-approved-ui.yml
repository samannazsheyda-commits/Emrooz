name: Build Emrooz v2.0.2 Approved UI

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-v202-approved-ui.yml'
      - 'approved_ui/**'

jobs:
  build-and-runtime-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct exact RNNT base source
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/transfer.b64
          for i in $(seq 0 27); do printf -v p '%03d' "$i"; cat "payload/v201.part${p}" >> /tmp/transfer.b64; done
          cat payload/v201.part028.a payload/v201.part028.b payload/v201.part028.c payload/v201.part028.d >> /tmp/transfer.b64
          for i in $(seq 29 40); do printf -v p '%03d' "$i"; cat "payload/v201.part${p}" >> /tmp/transfer.b64; done
          tr -d '\r\n' < /tmp/transfer.b64 | base64 -d > /tmp/transfer.tar.xz
          echo '8ee6d03b5243d4818d65daaec44fae8d713231a8e6bf1f51bc4eeafae2db210b  /tmp/transfer.tar.xz' | sha256sum -c -
          mkdir -p /tmp/emrooz
          tar -xJf /tmp/transfer.tar.xz -C /tmp/emrooz
          test -f /tmp/emrooz/app/build.gradle.kts

      - name: Install QA and image tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep python3-pil

      - name: Apply approved UI and build compatibility fixes
        shell: bash
        working-directory: /tmp/emrooz
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/approved_ui/SettingsStore.kt" app/src/main/java/com/nameemrooz/journal/data/SettingsStore.kt
          cp "$GITHUB_WORKSPACE/approved_ui/Theme.kt" app/src/main/java/com/nameemrooz/journal/ui/theme/Theme.kt
          cp "$GITHUB_WORKSPACE/approved_ui/AppViewModel.kt" app/src/main/java/com/nameemrooz/journal/ui/AppViewModel.kt
          cp "$GITHUB_WORKSPACE/approved_ui/BiometricGate.kt" app/src/main/java/com/nameemrooz/journal/privacy/BiometricGate.kt
          cp "$GITHUB_WORKSPACE/approved_ui/MainActivity.kt" app/src/main/java/com/nameemrooz/journal/MainActivity.kt
          cat "$GITHUB_WORKSPACE/approved_ui/NameEmroozApp.part00" \
              "$GITHUB_WORKSPACE/approved_ui/NameEmroozApp.part01" \
              "$GITHUB_WORKSPACE/approved_ui/NameEmroozApp.part02" \
              "$GITHUB_WORKSPACE/approved_ui/NameEmroozApp.part03" \
              > app/src/main/java/com/nameemrooz/journal/ui/NameEmroozApp.kt
          cp "$GITHUB_WORKSPACE/approved_ui/verify_approved_ui_contract.sh" tools/verify_approved_ui_contract.sh
          chmod +x tools/verify_approved_ui_contract.sh
          echo 'bd1d625a35274699232610fa4829f67bd73660478aecfff3072f8489c6c11159  app/src/main/java/com/nameemrooz/journal/ui/NameEmroozApp.kt' | sha256sum -c -

          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('app/build.gradle.kts')
          s = gradle.read_text()
          s = s.replace('versionCode = 31', 'versionCode = 32')
          s = s.replace('versionName = "2.0.1"', 'versionName = "2.0.2"')
          marker = '    buildFeatures { compose = true; buildConfig = true }\n'
          jvm17 = '''    compileOptions {\n        sourceCompatibility = org.gradle.api.JavaVersion.VERSION_17\n        targetCompatibility = org.gradle.api.JavaVersion.VERSION_17\n    }\n\n'''
          if 'sourceCompatibility = org.gradle.api.JavaVersion.VERSION_17' not in s:
              assert marker in s
              s = s.replace(marker, jvm17 + marker, 1)
          s = s.replace('androidx.room:room-runtime:2.6.1', 'androidx.room:room-runtime:2.8.5')
          s = s.replace('androidx.room:room-ktx:2.6.1', 'androidx.room:room-ktx:2.8.5')
          s = s.replace('androidx.room:room-compiler:2.6.1', 'androidx.room:room-compiler:2.8.5')
          gradle.write_text(s)

          manifest = Path('app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          if 'xmlns:tools=' not in m:
              m = m.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android"\n    xmlns:tools="http://schemas.android.com/tools">',
                  1,
              )
          if 'androidx.work.WorkManagerInitializer' not in m:
              provider = '''        <provider\n            android:name="androidx.startup.InitializationProvider"\n            android:authorities="${applicationId}.androidx-startup"\n            android:exported="false"\n            tools:node="merge">\n            <meta-data\n                android:name="androidx.work.WorkManagerInitializer"\n                android:value="androidx.startup"\n                tools:node="remove" />\n        </provider>\n'''
              m = m.replace('    </application>', provider + '    </application>', 1)
          manifest.write_text(m)
          PY

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="ic_launcher_background">#F7F2EA</color>
          </resources>
          EOF
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="Theme.NameEmrooz" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:windowLightNavigationBar">true</item>
                  <item name="android:navigationBarColor">#F7F2EA</item>
                  <item name="android:statusBarColor">#F7F2EA</item>
                  <item name="android:windowBackground">#F7F2EA</item>
              </style>
          </resources>
          EOF

          mkdir -p app/src/main/res/mipmap-anydpi-v26 app/src/main/res/drawable-nodpi
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground_png" />
          </adaptive-icon>
          EOF
          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          base64 -d "$GITHUB_WORKSPACE/approved_ui/app_icon.b64" > /tmp/approved_icon.png
          echo '35a48766e85ef796763661b5d7cedfd70477cced4e1834f93fe5570650503d43  /tmp/approved_icon.png' | sha256sum -c -
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src = Image.open('/tmp/approved_icon.png').convert('RGBA')
          cream=(247,242,234,255)
          # Legacy icons: exact approved reference centered on a square cream canvas.
          for density,size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              canvas=Image.new('RGBA',(256,256),cream)
              ref=src.copy(); ref.thumbnail((182,256),Image.Resampling.LANCZOS)
              canvas.alpha_composite(ref,((256-ref.width)//2,(256-ref.height)//2))
              out=canvas.resize((size,size),Image.Resampling.LANCZOS)
              p=Path(f'app/src/main/res/mipmap-{density}'); p.mkdir(parents=True,exist_ok=True)
              out.convert('RGB').save(p/'ic_launcher.png')
              out.convert('RGB').save(p/'ic_launcher_round.png')
          # Adaptive foreground: remove only the near-uniform cream background and preserve logo pixels.
          px=src.load()
          for y in range(src.height):
              for x in range(src.width):
                  r,g,b,a=px[x,y]
                  if abs(r-247)<20 and abs(g-242)<20 and abs(b-234)<20:
                      px[x,y]=(r,g,b,0)
          bbox=src.getbbox()
          fg=src.crop(bbox) if bbox else src
          fg.thumbnail((230,320),Image.Resampling.LANCZOS)
          canvas=Image.new('RGBA',(432,432),(0,0,0,0))
          canvas.alpha_composite(fg,((432-fg.width)//2,(432-fg.height)//2))
          canvas.save('app/src/main/res/drawable-nodpi/ic_launcher_foreground_png.png')
          PY

          grep -q 'versionCode = 32' app/build.gradle.kts
          grep -q 'versionName = "2.0.2"' app/build.gradle.kts
          grep -q 'JavaVersion.VERSION_17' app/build.gradle.kts
          grep -q 'room-compiler:2.8.5' app/build.gradle.kts
          grep -q 'tools:node="remove"' app/src/main/AndroidManifest.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: QA 1-2 - engine, privacy and approved UI contracts
        shell: bash
        working-directory: /tmp/emrooz
        run: |
          set -euo pipefail
          bash tools/test_shenava_rnnt_contract.sh
          bash tools/verify_live_engine_contract.sh
          bash tools/verify_approved_ui_contract.sh
          echo '0069292828dfac9a7d98294f1bfefd0e787cb3f008c49e1b2780e9a9f66ca5b5  app/src/main/res/drawable-nodpi/splash_emrooz_light.webp' | sha256sum -c -
          echo 'bd36788fa9fdc8dddf58b6221213dc9a390a70f758cd203f7a6efa1b3be499f5  app/src/main/res/drawable-nodpi/splash_emrooz_dark.webp' | sha256sum -c -
          ! rg -n 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          ! rg -n 'FileOutputStream|setOutputFile|openFileOutput|\.wav|\.mp3|\.m4a|\.aac' app/src/main/java/com/nameemrooz/journal/speech

      - name: QA 3-5 - unit tests, lint and arm64 release build
        shell: bash
        working-directory: /tmp/emrooz
        run: |
          set -euo pipefail
          gradle --no-daemon clean :app:testDebugUnitTest :app:lintRelease :app:assembleRelease

      - name: Sign release APK
        shell: bash
        working-directory: /tmp/emrooz
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$UNSIGNED"
          mkdir -p /tmp/out
          keytool -genkeypair -noprompt -keystore /tmp/emrooz-v202.jks -storepass emroozrelease -keypass emroozrelease -alias emrooz -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Emrooz,O=Emrooz,C=DE'
          "$BT/zipalign" -f 4 "$UNSIGNED" /tmp/out/aligned.apk
          "$BT/apksigner" sign --ks /tmp/emrooz-v202.jks --ks-pass pass:emroozrelease --key-pass pass:emroozrelease --out /tmp/out/Emrooz-v2.0.2-Approved-UI-Shenava-RNNT-arm64.apk /tmp/out/aligned.apk
          rm -f /tmp/out/aligned.apk

      - name: QA 6-9 - final APK integrity, model, privacy, ABI and metadata
        shell: bash
        working-directory: /tmp/emrooz
        run: |
          set -euo pipefail
          APK=/tmp/out/Emrooz-v2.0.2-Approved-UI-Shenava-RNNT-arm64.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -c -v 4 "$APK" >/tmp/zipalign.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK" >/tmp/signature.txt
          "$BT/aapt" dump badging "$APK" >/tmp/badging.txt
          "$BT/aapt" dump permissions "$APK" >/tmp/permissions.txt
          unzip -t "$APK" >/tmp/ziptest.txt
          grep -q "package: name='com.nameemrooz.journal' versionCode='32' versionName='2.0.2'" /tmp/badging.txt
          grep -q "sdkVersion:'26'" /tmp/badging.txt
          grep -q "targetSdkVersion:'35'" /tmp/badging.txt
          ! grep -q 'android.permission.INTERNET' /tmp/permissions.txt
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          test "$(unzip -Z1 "$APK" | grep '^lib/' | cut -d/ -f2 | sort -u | tr '\n' ' ')" = 'arm64-v8a '
          unzip -p "$APK" assets/models/shenava_v15_rnnt_int8/encoder.int8.onnx >/tmp/encoder.onnx
          unzip -p "$APK" assets/models/shenava_v15_rnnt_int8/decoder.int8.onnx >/tmp/decoder.onnx
          unzip -p "$APK" assets/models/shenava_v15_rnnt_int8/joiner.int8.onnx >/tmp/joiner.onnx
          unzip -p "$APK" assets/models/shenava_v15_rnnt_int8/tokens.txt >/tmp/tokens.txt
          echo 'b9d975c1af77002f83897017e3adaaa6510148c6ba332df92b8d281369f2fdd3  /tmp/encoder.onnx' | sha256sum -c -
          echo '0adaad326a536dfbb30c67287e909b4e6f0775fccb8c3ca47270890364824947  /tmp/decoder.onnx' | sha256sum -c -
          echo 'e441ed265c961ff4a2436aa8bc36638e65849445e7a1f65cf263f0c310593dde  /tmp/joiner.onnx' | sha256sum -c -
          echo '8e192963f6e666dfa5721e5cbd4710bc1ef592460a45f08cefc94b2db16a6954  /tmp/tokens.txt' | sha256sum -c -
          ! unzip -Z1 "$APK" | grep -Eqi 'whisper|rizeh|shenava_v10|ctc_model'
          rg -q 'FLAG_SECURE' app/src/main/java/com/nameemrooz/journal/MainActivity.kt
          rg -q 'AppTheme.DAY' app/src/main/java/com/nameemrooz/journal/data/SettingsStore.kt

      - name: Build x86_64 debug for runtime smoke
        shell: bash
        working-directory: /tmp/emrooz
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle.kts')
          s=p.read_text().replace('abiFilters += listOf("arm64-v8a")','abiFilters += listOf("x86_64")')
          p.write_text(s)
          PY
          gradle --no-daemon :app:assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: QA 10 - real Android launch smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            mkdir -p /tmp/out
            adb install -r /tmp/emrooz/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.nameemrooz.journal
            adb shell am start -W -n com.nameemrooz.journal/.MainActivity | tee /tmp/out/runtime-start.txt
            sleep 6
            PID=$(adb shell pidof com.nameemrooz.journal | tr -d '\r')
            test -n "$PID"
            adb logcat --pid="$PID" -d > /tmp/out/runtime-logcat.txt || true
            ! grep -q 'FATAL EXCEPTION' /tmp/out/runtime-logcat.txt
            adb exec-out screencap -p > /tmp/out/runtime-smoke.png
            test -s /tmp/out/runtime-smoke.png
            echo "RUNTIME_SMOKE_PASS pid=$PID"

      - name: Write QA report
        shell: bash
        working-directory: /tmp/emrooz
        run: |
          set -euo pipefail
          APK=/tmp/out/Emrooz-v2.0.2-Approved-UI-Shenava-RNNT-arm64.apk
          APK_SHA=$(sha256sum "$APK" | awk '{print $1}')
          APK_SIZE=$(stat -c '%s' "$APK")
          CERT=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/signature.txt | sed 's/.*digest: //')
          cat > /tmp/out/Emrooz-v2.0.2-QA-FA.md <<EOF
          # گزارش QA نهایی Emrooz v2.0.2

          1. PASS — سورس RNNT پایه با SHA-256 دقیق بازسازی شد.
          2. PASS — قرارداد UI تأییدشده: Abar/Lato، دو تم، دو زبان، UI size، شعار نهایی، آرشیو بدون عنوان، Glow متن زنده و Fingerprint-first.
          3. PASS — تست‌های واحد Gradle.
          4. PASS — Android lintRelease.
          5. PASS — assembleRelease arm64-v8a.
          6. PASS — مدل Shenava Koochik v1.5 RNNT INT8 با چهار SHA-256 دقیق؛ Whisper/مدل قدیمی وجود ندارد.
          7. PASS — بدون INTERNET permission؛ allowBackup=false؛ FLAG_SECURE؛ مسیر ذخیره فایل صوتی وجود ندارد.
          8. PASS — package/version/minSdk/targetSdk و arm64-v8a-only تأیید شد.
          9. PASS — ZIP/zipalign و امضای APK تأیید شد.
          10. PASS — APK debug هم‌کد روی Android 15 emulator نصب و MainActivity واقعاً اجرا شد؛ process زنده ماند و FATAL EXCEPTION ثبت نشد. Screenshot runtime-smoke.png ضمیمه Artifact است.

          APK SHA-256: $APK_SHA
          APK size: $APK_SIZE bytes
          Signing certificate SHA-256: $CERT
          EOF
          cat /tmp/out/Emrooz-v2.0.2-QA-FA.md

      - name: Upload final APK, QA and runtime proof
        uses: actions/upload-artifact@v4
        with:
          name: Emrooz-v2.0.2-Approved-UI-Shenava-RNNT
          path: |
            /tmp/out/Emrooz-v2.0.2-Approved-UI-Shenava-RNNT-arm64.apk
            /tmp/out/Emrooz-v2.0.2-QA-FA.md
            /tmp/out/runtime-smoke.png
            /tmp/out/runtime-start.txt
            /tmp/out/runtime-logcat.txt
          if-no-files-found: error
          retention-days: 30
