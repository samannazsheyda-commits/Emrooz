name: Inspect Emrooz vNext source

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/inspect-vnext.yml'

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Recover partial vNext content
        shell: bash
        run: |
          set -u
          cat patch/vnext.part* | base64 -d > /tmp/vnext.gz
          gzip -dc /tmp/vnext.gz > /tmp/vnext.raw 2>/tmp/gzip.err || true
          echo '=== SIZES ==='
          wc -c /tmp/vnext.gz /tmp/vnext.raw
          cat /tmp/gzip.err || true
          echo '=== RAW TYPE/HEAD ==='
          file /tmp/vnext.raw
          head -c 256 /tmp/vnext.raw | od -An -tc -v
          echo '=== TAR LIST PARTIAL ==='
          tar -tvf /tmp/vnext.raw 2>&1 | head -160 || true
          mkdir -p /tmp/recovered
          tar -xf /tmp/vnext.raw -C /tmp/recovered --ignore-zeros 2>/tmp/tar.err || true
          cat /tmp/tar.err || true
          echo '=== RECOVERED FILES ==='
          find /tmp/recovered -type f | sort | head -220
          echo '=== KEY FILE CONTENT ==='
          for f in $(find /tmp/recovered -type f \( -name 'LiveSpeechEngine.kt' -o -name 'PersianText.kt' -o -name 'SpeechTuning.kt' -o -name 'FinalTranscriptSelector.kt' -o -name 'PersianNameCorrector.kt' -o -name 'ShenavaOfflineRecognizer.kt' -o -name 'build.gradle.kts' \)); do
            echo "----- $f -----"
            sed -n '1,260p' "$f"
          done
