name: Inspect Emrooz vNext source

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/inspect-vnext.yml'

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect recovered recognizer and base engine
        shell: bash
        run: |
          set -u
          cat payload/v110.part* | base64 -d > /tmp/base.tar.gz
          mkdir -p /tmp/base && tar -xzf /tmp/base.tar.gz -C /tmp/base
          cat patch/vnext.part* | base64 -d > /tmp/vnext.gz
          gzip -dc /tmp/vnext.gz > /tmp/vnext.raw 2>/dev/null || true
          mkdir -p /tmp/recovered
          tar -xf /tmp/vnext.raw -C /tmp/recovered --ignore-zeros 2>/dev/null || true
          echo '=== RECOVERED SHENAVA ==='
          sed -n '1,260p' /tmp/recovered/app/src/main/java/com/nameemrooz/journal/speech/ShenavaRecognizer.kt
          echo '=== BASE ENGINE ==='
          sed -n '1,320p' /tmp/base/app/src/main/java/com/nameemrooz/journal/speech/LiveSpeechEngine.kt
          echo '=== RECOVERED MAIN ==='
          sed -n '1,220p' /tmp/recovered/app/src/main/java/com/nameemrooz/journal/MainActivity.kt
          echo '=== RECOVERED TEST ==='
          sed -n '1,220p' /tmp/recovered/app/src/test/java/com/nameemrooz/journal/util/PersianTextVNextTest.kt
