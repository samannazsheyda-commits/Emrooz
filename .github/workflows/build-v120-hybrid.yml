name: Build Emrooz v1.2.0 Hybrid Persian ASR

on:
  push:
    branches: [fix/v120-hybrid-whisper]
    paths:
      - 'overlay/v120/**'
      - '.github/workflows/build-v120-hybrid.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: Asia/Tehran

jobs:
  verify-build-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact v1.1.9 Quality Fix baseline
        shell: bash
        run: |
          set -euo pipefail
          cat payload/v110.part* | base64 -d > /tmp/base.tgz
          echo '3c0dfc2159467bf457f7235a8377dde233acebd637b68e6717836b4ebcdd5bee  /tmp/base.tgz' | sha256sum -c -
          tar -xzf /tmp/base.tgz -C .
          UI='app/src/main/java/com/nameemrooz/journal/ui/NameEmroozApp.kt'
          sed -i '/^import androidx\.compose\.foundation\.layout\.matchParentSize$/d' "$UI"
          sed -i '/^import androidx\.compose\.foundation\.layout\.weight$/d' "$UI"
          if [ -d fixes/app ]; then cp -a fixes/app/. app/; fi
          python3 fixes/apply_text_patch.py
          python3 fixes/apply_ui_patch.py
          cat payload/v114.part* | base64 -d > /tmp/v114.tgz
          echo 'a6cd02a6695a5f2421c5243cceaddc34b6d3fb8f7336bda6c7c493b75e83c4c7  /tmp/v114.tgz' | sha256sum -c -
          tar -xzf /tmp/v114.tgz -C .
          sed -i '/^import androidx\.compose\.foundation\.layout\.weight$/d' "$UI"
          cat payload/v116.vec.* > /tmp/v116.vec.b64
          echo '2a0cde7c006f090bea54ec4aac7cff82839340ed140893e64dec36183ca73f22  /tmp/v116.vec.b64' | sha256sum -c -
          base64 -d /tmp/v116.vec.b64 > /tmp/v116.tgz
          echo '468b2c892f05ffa25f6a59597fa0405d1903303f407656d52fe14814425caebd  /tmp/v116.tgz' | sha256sum -c -
          tar -xzf /tmp/v116.tgz -C .
          cat payload/v117.part.* > /tmp/v117.b64
          echo 'a75bf955e8e31cb7e7477ae20cc24aa5badab6bf48c5bb8c06c30cd7c03c72ed  /tmp/v117.b64' | sha256sum -c -
          base64 -d /tmp/v117.b64 > /tmp/v117.tgz
          echo '120fbbe7415e87e4cc3be91d2b9b9211a64f6a93a1bf632dc67d9c160d5f90c9  /tmp/v117.tgz' | sha256sum -c -
          tar -xzf /tmp/v117.tgz -C .
          cp overlay/v118/app/src/main/java/com/nameemrooz/journal/speech/LiveSpeechEngine.kt app/src/main/java/com/nameemrooz/journal/speech/LiveSpeechEngine.kt
          python3 overlay/v118/apply_v118.py
          python3 overlay/v119/apply_v119.py
          grep -Fq 'applicationId = "com.nameemrooz.journal.v119final"' app/build.gradle.kts
          grep -Fq 'versionName = "1.1.9"' app/build.gradle.kts

      - name: Restore exact runtime fonts and lexicons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/font app/src/main/assets/lexicon
          curl -L --fail --retry 5 --retry-all-errors --connect-timeout 30 -o app/src/main/res/font/noto_naskh_arabic.ttf 'https://raw.githubusercontent.com/google/fonts/ade3d1533e06b2b1462ffcde8e08b129627ca360/ofl/notonaskharabic/NotoNaskhArabic%5Bwght%5D.ttf'
          curl -L --fail --retry 5 --retry-all-errors --connect-timeout 30 -o app/src/main/res/font/vazirmatn_regular.ttf 'https://raw.githubusercontent.com/rastikerdar/vazirmatn/6e553e33489a8f9dfaccc76860a2e3f3c1e66de7/fonts/ttf/Vazirmatn-Regular.ttf'
          curl -L --fail --retry 5 --retry-all-errors --connect-timeout 30 -o app/src/main/res/font/vazirmatn_semibold.ttf 'https://raw.githubusercontent.com/rastikerdar/vazirmatn/6e553e33489a8f9dfaccc76860a2e3f3c1e66de7/fonts/ttf/Vazirmatn-SemiBold.ttf'
          curl -L --fail --retry 5 --retry-all-errors -o /tmp/names.json 'https://raw.githubusercontent.com/nabidam/persian-names/68f5cb39a25c19ecaf6f60f3181aea200f8206f8/names.json'
          curl -L --fail --retry 5 --retry-all-errors -o /tmp/surnames.csv 'https://raw.githubusercontent.com/farbodbj/iranian-surname-frequencies/9fb2fdccb62445b52e933d4d7929a52e01bd6011/iranian-surname-frequencies.csv'
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          def norm(v): return (v or '').strip().replace('ي','ی').replace('ى','ی').replace('ك','ک').replace('ة','ه')
          lex=Path('app/src/main/assets/lexicon')
          d=json.loads(Path('/tmp/names.json').read_text(encoding='utf-8-sig'))
          names={norm(x) for x in d.keys() if norm(x)}
          names.update({'سهیل','روح‌الله','روح الله'})
          (lex/'persian_first_names.txt').write_text('\n'.join(sorted(names))+'\n',encoding='utf-8')
          surnames={}
          with open('/tmp/surnames.csv',encoding='utf-8-sig',newline='') as f:
              for row in csv.DictReader(f):
                  n=norm(row.get('name',''))
                  if not n: continue
                  try: freq=float(row.get('frequency',0) or 0)
                  except ValueError: freq=0.0
                  surnames[n]=max(surnames.get(n,0),max(1,int(round(freq*1_000_000_000))))
          surnames['ممدوحی']=max(surnames.get('ممدوحی',0),1)
          with (lex/'persian_surnames.tsv').open('w',encoding='utf-8') as f:
              for n,score in sorted(surnames.items()): f.write(f'{n}\t{score}\n')
          PY

      - name: Snapshot UI and resources before speech overhaul
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          tracked=[]
          ui=Path('app/src/main/java/com/nameemrooz/journal/ui/NameEmroozApp.kt')
          tracked.append(ui)
          tracked.extend(sorted(Path('app/src/main/res').rglob('*')))
          hashes={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in tracked if p.is_file()}
          Path('/tmp/ui-before.json').write_text(json.dumps(hashes,sort_keys=True),encoding='utf-8')
          print('UI_RESOURCE_BASELINE_FILES',len(hashes))
          PY

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install Android native/build toolchain
        run: sdkmanager "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" "ndk;25.2.9519653" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }

      - name: Build pinned official whisper.cpp Android AAR
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/whisper.cpp
          git clone --depth 1 --branch v1.9.3 https://github.com/ggml-org/whisper.cpp.git /tmp/whisper.cpp
          test "$(git -C /tmp/whisper.cpp rev-parse HEAD)" = '371b5a7561823ab2bb32142d2751e35e7534727b'
          cd /tmp/whisper.cpp
          python3 "$GITHUB_WORKSPACE/overlay/v120/native/patch_whisper_android.py"
          cd examples/whisper.android
          chmod +x gradlew
          ./gradlew --no-daemon :lib:assembleRelease
          AAR='lib/build/outputs/aar/lib-release.aar'
          test -s "$AAR"
          unzip -l "$AAR" | tee /tmp/aar-list
          grep -q 'classes.jar' /tmp/aar-list
          grep -q 'jni/arm64-v8a/libwhisper.so' /tmp/aar-list
          grep -q 'jni/arm64-v8a/libwhisper_v8fp16_va.so' /tmp/aar-list
          ! grep -q 'jni/armeabi-v7a/' /tmp/aar-list
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp "$AAR" "$GITHUB_WORKSPACE/app/libs/whispercpp-fa-release.aar"

      - name: Download pinned streaming CTC and Whisper Small Q5_1
        shell: bash
        run: |
          set -euo pipefail
          STREAM='app/src/main/assets/models/shenava_v10_ctc'
          WHISPER='app/src/main/assets/models/whisper'
          rm -rf app/src/main/assets/models/shenava_v10_ctc_offline
          mkdir -p "$STREAM" "$WHISPER"
          get() { out="$1"; primary="$2"; fallback="$3"; rm -f "$out"; curl -L --fail --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 30 --max-time 1800 -A 'Emrooz-v120' -o "$out" "$primary" || { rm -f "$out"; curl -L --fail --retry 8 --retry-all-errors --retry-delay 8 --connect-timeout 30 --max-time 1800 -A 'Emrooz-v120' -o "$out" "$fallback"; }; }
          SR='mah92/sherpa-onnx-nemo-ctc-fa-shenava-koochik-v1.0-streaming-int8-2026-06-26'; REV='ae7a6e0f530d30f3a110e26724dca4efce01a85e'
          get "$STREAM/model.onnx" "https://hf-mirror.com/$SR/resolve/$REV/model.int8.onnx?download=true" "https://huggingface.co/$SR/resolve/$REV/model.int8.onnx?download=true"
          get "$STREAM/tokens.txt" "https://hf-mirror.com/$SR/resolve/$REV/tokens.txt?download=true" "https://huggingface.co/$SR/resolve/$REV/tokens.txt?download=true"
          echo '439983c95ab83c55c841e0795ba3a61d56718ec5c972a3a208548b93470b04b1  app/src/main/assets/models/shenava_v10_ctc/model.onnx' | sha256sum -c -
          get "$WHISPER/ggml-small-q5_1.bin" 'https://hf-mirror.com/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin?download=true' 'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin?download=true'
          echo 'ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb  app/src/main/assets/models/whisper/ggml-small-q5_1.bin' | sha256sum -c -
          test ! -e app/src/main/assets/models/shenava_v10_ctc_offline/model.onnx

      - name: Apply only v1.2.0 speech/runtime overlay
        shell: bash
        run: |
          set -euo pipefail
          SPEECH='app/src/main/java/com/nameemrooz/journal/speech'
          mkdir -p "$SPEECH"
          cp overlay/v120/app/src/main/java/com/nameemrooz/journal/speech/*.kt "$SPEECH/"
          python3 overlay/v120/apply_v120.py
          mkdir -p app/src/test/java/com/nameemrooz/journal/speech app/src/test/java/com/nameemrooz/journal/util
          cp overlay/v120/tests/*.kt app/src/test/java/com/nameemrooz/journal/speech/
          cp overlay/v119/tests/PersianQualityV119Test.kt app/src/test/java/com/nameemrooz/journal/util/PersianQualityV119Test.kt

      - name: Prove UI is byte-identical and hybrid architecture is active
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          before=json.loads(Path('/tmp/ui-before.json').read_text(encoding='utf-8'))
          tracked=[]
          ui=Path('app/src/main/java/com/nameemrooz/journal/ui/NameEmroozApp.kt')
          tracked.append(ui)
          tracked.extend(sorted(Path('app/src/main/res').rglob('*')))
          after={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in tracked if p.is_file()}
          assert before == after, 'UI or resource drift detected in v1.2.0 speech-only overhaul'
          u=ui.read_text(encoding='utf-8')
          assert 'Modifier.fillMaxWidth(0.38f).height(115.dp)' in u
          clock=u[u.index('private fun CurrentClockAndDate'):u.index('private fun LetterEditorCard')]
          assert 'DoranTimeLine(' in clock and 'DoranDateLine(' in clock
          card=u[u.index('private fun LetterEditorCard'):u.index('private fun SoftListeningDot')]
          assert card.index('.clip(shape)') < card.index('.transcriptionGlow(converting)')
          print('V120_UI_BYTE_IDENTICAL_OK')
          PY
          ENGINE='app/src/main/java/com/nameemrooz/journal/speech/LiveSpeechEngine.kt'
          grep -Fq 'WhisperFinalRecognizer' "$ENGINE"
          grep -Fq 'HybridTranscriptPolicy.choose' "$ENGINE"
          grep -Fq 'SpeechSessionGate' "$ENGINE"
          grep -Fq 'AudioSourceSelector.choose' "$ENGINE"
          ! grep -Fq 'ShenavaOfflineRecognizer' "$ENGINE"
          grep -Fq 'applicationId = "com.nameemrooz.journal.v120hybrid"' app/build.gradle.kts
          grep -Fq 'versionCode = 23' app/build.gradle.kts
          grep -Fq 'versionName = "1.2.0"' app/build.gradle.kts
          grep -Fq 'implementation(files("libs/whispercpp-fa-release.aar"))' app/build.gradle.kts

      - name: GREEN hybrid ASR tests
        run: |
          gradle --no-daemon --stacktrace :app:testReleaseUnitTest \
            --tests 'com.nameemrooz.journal.speech.HybridTranscriptPolicyTest' \
            --tests 'com.nameemrooz.journal.speech.AudioSourceSelectorTest' \
            --tests 'com.nameemrooz.journal.speech.SpeechSessionGateTest' \
            --tests 'com.nameemrooz.journal.speech.WhisperFinalRecognizerContractTest'

      - name: Run complete unit suite
        run: gradle --no-daemon --stacktrace :app:testReleaseUnitTest

      - name: Android lint
        run: gradle --no-daemon --stacktrace :app:lintRelease

      - name: Acoustic smoke test pinned Persian WAV with same Whisper model
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/whisper.cpp
          cmake -S . -B /tmp/whisper-desktop-build -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON -DWHISPER_BUILD_SERVER=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/whisper-desktop-build --target whisper-cli -j2
          curl -L --fail --retry 5 --retry-all-errors -o /tmp/example-fa.wav 'https://huggingface.co/speechbrain/asr-whisper-large-v2-commonvoice-fa/resolve/23e57e2459f1d402d7aa077af3784b788bcc4dea/example-fa.wav?download=true'
          test $(stat -c%s /tmp/example-fa.wav) -gt 500000
          /tmp/whisper-desktop-build/bin/whisper-cli -m "$GITHUB_WORKSPACE/app/src/main/assets/models/whisper/ggml-small-q5_1.bin" -f /tmp/example-fa.wav -l fa -nt 2>&1 | tee /tmp/persian-smoke.txt
          python3 - <<'PY'
          import re
          text=open('/tmp/persian-smoke.txt',encoding='utf-8',errors='ignore').read()
          chars=re.findall(r'[\u0600-\u06FF]',text)
          assert len(chars) >= 8, 'Whisper acoustic smoke did not yield enough Persian text'
          print('PERSIAN_WHISPER_ACOUSTIC_SMOKE_OK',len(chars))
          PY

      - name: Generate install-safe signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing
          keytool -genkeypair -keystore signing/emrooz-release.jks -storepass Emrooz2026Release -alias emrooz -keypass Emrooz2026Release -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Emrooz v120 Hybrid CI,OU=Android,O=Emrooz,C=IR'
          cat > signing/keystore.properties <<'EOF'
          storeFile=signing/emrooz-release.jks
          storePassword=Emrooz2026Release
          keyAlias=emrooz
          keyPassword=Emrooz2026Release
          EOF

      - name: Build release APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify final APK independently
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -s "$APK"
          test $(stat -c%s "$APK") -lt 450887680
          unzip -t "$APK" | tee /tmp/zipcheck
          grep -q 'No errors detected' /tmp/zipcheck
          unzip -l "$APK" | tee /tmp/apk-list
          grep -q 'assets/models/shenava_v10_ctc/model.onnx' /tmp/apk-list
          grep -q 'assets/models/whisper/ggml-small-q5_1.bin' /tmp/apk-list
          ! grep -q 'assets/models/shenava_v10_ctc_offline/model.onnx' /tmp/apk-list
          grep -q 'lib/arm64-v8a/libwhisper.so' /tmp/apk-list
          grep -q 'assets/lexicon/persian_first_names.txt' /tmp/apk-list
          "$AAPT" dump badging "$APK" | tee /tmp/badging
          grep -q "package: name='com.nameemrooz.journal.v120hybrid' versionCode='23' versionName='1.2.0'" /tmp/badging
          "$AAPT" dump permissions "$APK" | tee /tmp/perms
          grep -q 'android.permission.RECORD_AUDIO' /tmp/perms
          ! grep -q 'android.permission.INTERNET' /tmp/perms
          "$AAPT" dump resources "$APK" > /tmp/resources
          grep -q 'splash_logo_exact' /tmp/resources
          grep -q 'app_icon_exact' /tmp/resources
          grep -q 'doran_digit_0' /tmp/resources
          grep -q 'doran_weekday_0' /tmp/resources
          "$SIGNER" verify --verbose "$APK" | tee /tmp/sign
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/sign
          mkdir -p deliver
          cp "$APK" deliver/Emrooz-v1.2.0-HYBRID-PERSIAN.apk
          sha256sum deliver/Emrooz-v1.2.0-HYBRID-PERSIAN.apk | tee deliver/Emrooz-v1.2.0-HYBRID-PERSIAN.apk.sha256
          stat -c 'FINAL_APK_BYTES=%s' deliver/Emrooz-v1.2.0-HYBRID-PERSIAN.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Emrooz-v1.2.0-HYBRID-PERSIAN
          path: deliver/
          compression-level: 0
          retention-days: 14

      - name: Publish direct-download release
        shell: bash
        run: |
          set -euo pipefail
          TAG='v1.2.0-hybrid-persian'
          APK='deliver/Emrooz-v1.2.0-HYBRID-PERSIAN.apk'
          SHA='deliver/Emrooz-v1.2.0-HYBRID-PERSIAN.apk.sha256'
          NOTES='Exact v1.1.9 Emrooz UI/resources, with fully-offline hybrid Persian ASR: Shenava streaming draft + pinned Whisper Small Q5_1 final pass. No raw audio is saved. Physical-device microphone accuracy still requires real-device testing.'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SHA" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" "$SHA" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Emrooz v1.2.0 Hybrid Persian ASR' --notes "$NOTES"
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets,url,tagName | tee /tmp/release.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/release.json'))
          a=[x for x in d['assets'] if x['name']=='Emrooz-v1.2.0-HYBRID-PERSIAN.apk']
          assert len(a)==1 and 300_000_000 < a[0]['size'] < 450_887_680
          print(a[0]['url'])
          PY
