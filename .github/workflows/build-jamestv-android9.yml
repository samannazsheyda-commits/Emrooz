name: Build James Cinema real-data beta for Android 9
on:
  workflow_dispatch:
  push:
    branches:
      - work/james-cinema-realdata-v3
    paths:
      - 'james_tv/**'
      - '.github/workflows/build-jamestv-android9.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35
        run: |
          SDK_MANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -1)"
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check catalog scanner Javascript syntax
        run: |
          node --check james_tv/app/src/main/assets/tv_catalog.js
          node --check james_tv/app/src/main/assets/tv_navigation.js
      - name: Compile, dex, sign debug APK
        working-directory: james_tv
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Allow KVM access
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Android 9 emulator launch test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            adb install -r james_tv/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.personal.jamestv9/.MainActivity
            sleep 10
            echo "Process status:"
            adb shell pidof com.personal.jamestv9
            echo "Foreground activity:"
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|com.personal.jamestv9' | head -30
            echo "Java crash log:"
            adb logcat -d -s AndroidRuntime:E | tail -100
            adb shell uiautomator dump /sdcard/intro.xml
            adb pull /sdcard/intro.xml james_tv/intro-ui.xml
            grep -q 'Viewing full screen' james_tv/intro-ui.xml && adb shell input tap 1238 526 || true
            sleep 3
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml james_tv/login-ui.xml
            adb exec-out screencap -p > james_tv/login-screen.png
            head -c 3500 james_tv/login-ui.xml || true
      - uses: actions/upload-artifact@v4
        with:
          name: JamesCinema-RealData-Android9-Beta
          path: |
            james_tv/app/build/outputs/apk/debug/app-debug.apk
            james_tv/login-screen.png
            james_tv/login-ui.xml
          if-no-files-found: error
