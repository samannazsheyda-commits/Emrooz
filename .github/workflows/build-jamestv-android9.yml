name: Build James TV Android 9 APK
on:
  workflow_dispatch:
  push:
    branches:
      - work/jamestv-android9-build
    paths:
      - 'james_tv/**'
      - '.github/workflows/build-jamestv-android9.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35
        run: |
          SDK_MANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -1)"
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile, dex, sign debug APK
        working-directory: james_tv
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Allow KVM access
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Android 9 emulator launch test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            adb install -r james_tv/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.personal.jamestv9/.MainActivity
            sleep 10
            echo "Process status:"
            adb shell pidof com.personal.jamestv9
            echo "Foreground activity:"
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|com.personal.jamestv9' | head -30
            echo "Java crash log:"
            adb logcat -d -s AndroidRuntime:E | tail -100
      - uses: actions/upload-artifact@v4
        with:
          name: JamesTV-Android9-installable-APK
          path: james_tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
