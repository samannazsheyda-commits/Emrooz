name: Build Emrooz v1.2.1 Fast Editor

on:
  push:
    branches: [fix/v121-fast-editor]
    paths:
      - 'overlay/v121/app/**'
      - 'overlay/v121/apply_v121.py'
      - 'overlay/v121/tests/**'
      - '.github/workflows/build-v121-fast-editor.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: Asia/Tehran

jobs:
  verify-build-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact v1.1.9 baseline
        shell: bash
        run: |
          set -euo pipefail
          cat payload/v110.part* | base64 -d > /tmp/base.tgz
          echo '3c0dfc2159467bf457f7235a8377dde233acebd637b68e6717836b4ebcdd5bee  /tmp/base.tgz' | sha256sum -c -
          tar -xzf /tmp/base.tgz -C .
          UI='app/src/main/java/com/nameemrooz/journal/ui/NameEmroozApp.kt'
          sed -i '/^import androidx\.compose\.foundation\.layout\.matchParentSize$/d' "$UI"
          sed -i '/^import androidx\.compose\.foundation\.layout\.weight$/d' "$UI"
          if [ -d fixes/app ]; then cp -a fixes/app/. app/; fi
          python3 fixes/apply_text_patch.py
          python3 fixes/apply_ui_patch.py
          cat payload/v114.part* | base64 -d > /tmp/v114.tgz
          echo 'a6cd02a6695a5f2421c5243cceaddc34b6d3fb8f7336bda6c7c493b75e83c4c7  /tmp/v114.tgz' | sha256sum -c -
          tar -xzf /tmp/v114.tgz -C .
          sed -i '/^import androidx\.compose\.foundation\.layout\.weight$/d' "$UI"
          cat payload/v116.vec.* > /tmp/v116.vec.b64
          echo '2a0cde7c006f090bea54ec4aac7cff82839340ed140893e64dec36183ca73f22  /tmp/v116.vec.b64' | sha256sum -c -
          base64 -d /tmp/v116.vec.b64 > /tmp/v116.tgz
          echo '468b2c892f05ffa25f6a59597fa0405d1903303f407656d52fe14814425caebd  /tmp/v116.tgz' | sha256sum -c -
          tar -xzf /tmp/v116.tgz -C .
          cat payload/v117.part.* > /tmp/v117.b64
          echo 'a75bf955e8e31cb7e7477ae20cc24aa5badab6bf48c5bb8c06c30cd7c03c72ed  /tmp/v117.b64' | sha256sum -c -
          base64 -d /tmp/v117.b64 > /tmp/v117.tgz
          echo '120fbbe7415e87e4cc3be91d2b9b9211a64f6a93a1bf632dc67d9c160d5f90c9  /tmp/v117.tgz' | sha256sum -c -
          tar -xzf /tmp/v117.tgz -C .
          cp overlay/v118/app/src/main/java/com/nameemrooz/journal/speech/LiveSpeechEngine.kt app/src/main/java/com/nameemrooz/journal/speech/LiveSpeechEngine.kt
          python3 overlay/v118/apply_v118.py
          python3 overlay/v119/apply_v119.py
          grep -Fq 'applicationId = "com.nameemrooz.journal.v119final"' app/build.gradle.kts
          grep -Fq 'versionName = "1.1.9"' app/build.gradle.kts

      - name: Restore runtime fonts and lexicons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/font app/src/main/assets/lexicon
          curl -L --fail --retry 5 --retry-all-errors --connect-timeout 30 -o app/src/main/res/font/noto_naskh_arabic.ttf 'https://raw.githubusercontent.com/google/fonts/ade3d1533e06b2b1462ffcde8e08b129627ca360/ofl/notonaskharabic/NotoNaskhArabic%5Bwght%5D.ttf'
          curl -L --fail --retry 5 --retry-all-errors --connect-timeout 30 -o app/src/main/res/font/vazirmatn_regular.ttf 'https://raw.githubusercontent.com/rastikerdar/vazirmatn/6e553e33489a8f9dfaccc76860a2e3f3c1e66de7/fonts/ttf/Vazirmatn-Regular.ttf'
          curl -L --fail --retry 5 --retry-all-errors --connect-timeout 30 -o app/src/main/res/font/vazirmatn_semibold.ttf 'https://raw.githubusercontent.com/rastikerdar/vazirmatn/6e553e33489a8f9dfaccc76860a2e3f3c1e66de7/fonts/ttf/Vazirmatn-SemiBold.ttf'
          curl -L --fail --retry 5 --retry-all-errors -o /tmp/names.json 'https://raw.githubusercontent.com/nabidam/persian-names/68f5cb39a25c19ecaf6f60f3181aea200f8206f8/names.json'
          curl -L --fail --retry 5 --retry-all-errors -o /tmp/surnames.csv 'https://raw.githubusercontent.com/farbodbj/iranian-surname-frequencies/9fb2fdccb62445b52e933d4d7929a52e01bd6011/iranian-surname-frequencies.csv'
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          def norm(v): return (v or '').strip().replace('ي','ی').replace('ى','ی').replace('ك','ک').replace('ة','ه')
          lex=Path('app/src/main/assets/lexicon')
          d=json.loads(Path('/tmp/names.json').read_text(encoding='utf-8-sig'))
          names={norm(x) for x in d.keys() if norm(x)}
          names.update({'سهیل','روح‌الله','روح الله'})
          (lex/'persian_first_names.txt').write_text('\n'.join(sorted(names))+'\n',encoding='utf-8')
          surnames={}
          with open('/tmp/surnames.csv',encoding='utf-8-sig',newline='') as f:
              for row in csv.DictReader(f):
                  n=norm(row.get('name',''))
                  if not n: continue
                  try: freq=float(row.get('frequency',0) or 0)
                  except ValueError: freq=0.0
                  surnames[n]=max(surnames.get(n,0),max(1,int(round(freq*1_000_000_000))))
          surnames['ممدوحی']=max(surnames.get('ممدوحی',0),1)
          with (lex/'persian_surnames.tsv').open('w',encoding='utf-8') as f:
              for n,score in sorted(surnames.items()): f.write(f'{n}\t{score}\n')
          PY

      - name: Snapshot UI before requested clock tweak
        shell: bash
        run: |
          set -euo pipefail
          cp app/src/main/java/com/nameemrooz/journal/ui/NameEmroozApp.kt /tmp/ui-before.kt

      - name: Download pinned streaming Persian model only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app/src/main/assets/models
          STREAM='app/src/main/assets/models/shenava_v10_ctc'
          mkdir -p "$STREAM"
          get() { out="$1"; primary="$2"; fallback="$3"; rm -f "$out"; curl -L --fail --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 30 --max-time 1200 -A 'Emrooz-v121' -o "$out" "$primary" || { rm -f "$out"; curl -L --fail --retry 8 --retry-all-errors --retry-delay 8 --connect-timeout 30 --max-time 1200 -A 'Emrooz-v121' -o "$out" "$fallback"; }; }
          SR='mah92/sherpa-onnx-nemo-ctc-fa-shenava-koochik-v1.0-streaming-int8-2026-06-26'
          REV='ae7a6e0f530d30f3a110e26724dca4efce01a85e'
          get "$STREAM/model.onnx" "https://hf-mirror.com/$SR/resolve/$REV/model.int8.onnx?download=true" "https://huggingface.co/$SR/resolve/$REV/model.int8.onnx?download=true"
          get "$STREAM/tokens.txt" "https://hf-mirror.com/$SR/resolve/$REV/tokens.txt?download=true" "https://huggingface.co/$SR/resolve/$REV/tokens.txt?download=true"
          echo '439983c95ab83c55c841e0795ba3a61d56718ec5c972a3a208548b93470b04b1  app/src/main/assets/models/shenava_v10_ctc/model.onnx' | sha256sum -c -
          test -s "$STREAM/tokens.txt"
          test ! -e app/src/main/assets/models/shenava_v10_ctc_offline/model.onnx
          test ! -e app/src/main/assets/models/whisper/ggml-small-q5_1.bin

      - name: Apply v1.2.1 runtime and editor fixes
        shell: bash
        run: |
          set -euo pipefail
          SPEECH='app/src/main/java/com/nameemrooz/journal/speech'
          mkdir -p "$SPEECH" app/src/test/java/com/nameemrooz/journal/speech app/src/test/java/com/nameemrooz/journal/util
          cp overlay/v121/app/src/main/java/com/nameemrooz/journal/speech/*.kt "$SPEECH/"
          python3 overlay/v121/apply_v121.py
          cp overlay/v121/tests/AudioSourceSelectorV121Test.kt app/src/test/java/com/nameemrooz/journal/speech/
          cp overlay/v121/tests/HybridTranscriptPolicyV121Test.kt app/src/test/java/com/nameemrooz/journal/speech/
          cp overlay/v121/tests/PersianEditorV121Test.kt app/src/test/java/com/nameemrooz/journal/util/
          cp overlay/v119/tests/PersianQualityV119Test.kt app/src/test/java/com/nameemrooz/journal/util/PersianQualityV119Test.kt

      - name: Prove scope and fast single-pass architecture
        shell: bash
        run: |
          set -euo pipefail
          ENGINE='app/src/main/java/com/nameemrooz/journal/speech/LiveSpeechEngine.kt'
          UI='app/src/main/java/com/nameemrooz/journal/ui/NameEmroozApp.kt'
          grep -Fq 'height = 17.dp' "$UI"
          grep -Fq 'Spacer(Modifier.height(7.dp))' "$UI"
          grep -Fq 'height = 13.dp' "$UI"
          python3 - <<'PY'
          from pathlib import Path
          before=Path('/tmp/ui-before.kt').read_text(encoding='utf-8')
          after=Path('app/src/main/java/com/nameemrooz/journal/ui/NameEmroozApp.kt').read_text(encoding='utf-8')
          expected=before.replace('height = 21.dp,\n        includeLabel = false', 'height = 17.dp,\n        includeLabel = false', 1).replace('Spacer(Modifier.height(3.dp))', 'Spacer(Modifier.height(7.dp))', 1)
          assert after == expected, 'Unexpected UI drift beyond clock/date spacing'
          print('V121_UI_SCOPE_OK')
          PY
          grep -Fq 'MediaRecorder.AudioSource.VOICE_RECOGNITION' "$ENGINE"
          grep -Fq 'AudioSourceSelector.choose' "$ENGINE"
          grep -Fq 'SpeechSessionGate' "$ENGINE"
          ! grep -Fq 'WhisperFinalRecognizer' "$ENGINE"
          ! grep -Fq 'ShenavaOfflineRecognizer' "$ENGINE"
          ! grep -Fq 'FinalTranscriptSelector.choose' "$ENGINE"
          ! grep -Fq 'finalPcm' "$ENGINE"
          ! grep -Fq 'audioChunks' "$ENGINE"
          grep -Fq 'applicationId = "com.nameemrooz.journal.v121fast"' app/build.gradle.kts
          grep -Fq 'versionCode = 24' app/build.gradle.kts
          grep -Fq 'versionName = "1.2.1"' app/build.gradle.kts
          ! find app/src/main/assets -iname '*whisper*' -print | grep -q .
          ! find app/src/main/assets -iname '*offline*' -print | grep -q .
          echo V121_FAST_SINGLE_PASS_GATES_OK

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }

      - name: GREEN reported-regression tests
        run: |
          gradle --no-daemon --stacktrace :app:testReleaseUnitTest \
            --tests 'com.nameemrooz.journal.speech.AudioSourceSelectorV121Test' \
            --tests 'com.nameemrooz.journal.speech.HybridTranscriptPolicyV121Test' \
            --tests 'com.nameemrooz.journal.util.PersianEditorV121Test'

      - name: Complete unit suite
        run: gradle --no-daemon --stacktrace :app:testReleaseUnitTest

      - name: Android lint
        run: gradle --no-daemon --stacktrace :app:lintRelease

      - name: Generate install-safe signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing
          keytool -genkeypair -keystore signing/emrooz-release.jks -storepass Emrooz2026Release -alias emrooz -keypass Emrooz2026Release -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Emrooz v121 CI,OU=Android,O=Emrooz,C=IR'
          cat > signing/keystore.properties <<'EOF'
          storeFile=signing/emrooz-release.jks
          storePassword=Emrooz2026Release
          keyAlias=emrooz
          keyPassword=Emrooz2026Release
          EOF

      - name: Build release APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify final APK independently
        shell: bash
        run: |
          set -euo pipefail
          SRC="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n1)"
          test -n "$SRC" && test -s "$SRC"
          APK='Emrooz-v1.2.1-FAST-EDITOR.apk'
          cp "$SRC" "$APK"
          unzip -t "$APK" >/tmp/unzip-test.txt
          unzip -l "$APK" >/tmp/apk-list.txt
          grep -q 'assets/models/shenava_v10_ctc/model.onnx' /tmp/apk-list.txt
          grep -q 'assets/models/shenava_v10_ctc/tokens.txt' /tmp/apk-list.txt
          ! grep -qi 'whisper' /tmp/apk-list.txt
          ! grep -qi 'shenava_v10_ctc_offline' /tmp/apk-list.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.nameemrooz.journal.v121fast'" /tmp/badging.txt
          grep -q "versionName='1.2.1'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee /tmp/permissions.txt
          grep -q 'android.permission.RECORD_AUDIO' /tmp/permissions.txt
          ! grep -q 'android.permission.INTERNET' /tmp/permissions.txt
          sha256sum "$APK" | tee "$APK.sha256"
          du -h "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Emrooz-v1.2.1-FAST-EDITOR
          path: |
            Emrooz-v1.2.1-FAST-EDITOR.apk
            Emrooz-v1.2.1-FAST-EDITOR.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct-download release
        shell: bash
        run: |
          set -euo pipefail
          TAG='v1.2.1-fast-editor'
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" Emrooz-v1.2.1-FAST-EDITOR.apk Emrooz-v1.2.1-FAST-EDITOR.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title 'Emrooz v1.2.1 – Fast Editor' \
            --notes 'Single-pass offline Persian speech build. Removes the slow Whisper/full-session second pass, uses Android VOICE_RECOGNITION input, strengthens conservative Persian orthographic cleanup, reduces the clock size, and increases clock/date spacing. RECORD_AUDIO only; no INTERNET permission.'
