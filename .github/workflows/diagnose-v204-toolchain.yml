name: Diagnose v2.0.4 Kotlin Toolchain

on:
  push:
    branches: [work/gemini-nano-editor-v204]
    paths:
      - '.github/workflows/diagnose-v204-toolchain.yml'

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct project and print toolchain
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/transfer.b64
          for i in $(seq 0 27); do printf -v p '%03d' "$i"; cat "payload/v201.part${p}" >> /tmp/transfer.b64; done
          cat payload/v201.part028.a payload/v201.part028.b payload/v201.part028.c payload/v201.part028.d >> /tmp/transfer.b64
          for i in $(seq 29 40); do printf -v p '%03d' "$i"; cat "payload/v201.part${p}" >> /tmp/transfer.b64; done
          tr -d '\r\n' < /tmp/transfer.b64 | base64 -d > /tmp/transfer.tar.xz
          rm -rf /tmp/emrooz && mkdir -p /tmp/emrooz
          tar -xJf /tmp/transfer.tar.xz -C /tmp/emrooz
          echo '=== settings.gradle.kts ==='
          cat /tmp/emrooz/settings.gradle.kts || true
          echo '=== root build.gradle.kts ==='
          cat /tmp/emrooz/build.gradle.kts || true
          echo '=== gradle.properties ==='
          cat /tmp/emrooz/gradle.properties || true
          echo '=== version catalogs ==='
          find /tmp/emrooz/gradle -maxdepth 2 -type f -print -exec cat {} \; 2>/dev/null || true
          echo '=== kotlin references ==='
          grep -RniE 'kotlin|androidGradlePlugin|com.android.application' /tmp/emrooz/settings.gradle.kts /tmp/emrooz/build.gradle.kts /tmp/emrooz/gradle 2>/dev/null || true
