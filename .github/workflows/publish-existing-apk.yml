name: Publish Emrooz 2.1.0 Direct APK

on:
  push:
    branches:
      - build/emrooz-final-rnnt-tts-20260914
    paths:
      - '.github/workflows/publish-existing-apk.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_ARTIFACT_ID: '10366086409'
      RELEASE_TAG: 'v2.1.0-final'
      APK_NAME: 'Emrooz-2.1.0-Shenava-RNNT-Offline-TTS-arm64.apk'
      APK_SHA256: '15c3852090083c4b832f810ff50d517dc56894303331c540a6fefee07f0877a8'
      APK_SIZE: '496937224'
    steps:
      - name: Download verified build artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o /tmp/emrooz-artifact.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip"
          mkdir -p artifact
          unzip -q /tmp/emrooz-artifact.zip -d artifact
          test -f "artifact/$APK_NAME"
          test "$(stat -c%s "artifact/$APK_NAME")" = "$APK_SIZE"
          printf '%s  %s\n' "$APK_SHA256" "artifact/$APK_NAME" | sha256sum -c -

      - name: Publish public GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          assets=("artifact/$APK_NAME")
          test -f artifact/QA-Emrooz-2.1.0.txt && assets+=("artifact/QA-Emrooz-2.1.0.txt")
          test -f artifact/apk-sha256.txt && assets+=("artifact/apk-sha256.txt")
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Emrooz 2.1.0 — Shenava RNNT Offline" \
              --notes "Fresh verified Android build. Bundled Shenava v1.5 RNNT INT8, sherpa-onnx runtime and offline Persian TTS. No previous APK was used as the final baseline."
          fi

      - name: Verify direct APK release asset
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets,url > /tmp/release.json
          python3 - <<'PY'
          import json, os
          data = json.load(open('/tmp/release.json'))
          expected_name = os.environ['APK_NAME']
          expected_size = int(os.environ['APK_SIZE'])
          assets = {asset['name']: asset for asset in data['assets']}
          assert expected_name in assets, assets.keys()
          assert assets[expected_name]['size'] == expected_size, assets[expected_name]
          print(assets[expected_name]['url'])
          PY
