name: Publish Verified Emrooz APK

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-existing-apk.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_ARTIFACT_ID: '9700136196'
      RELEASE_TAG: 'v1.0.2-full-offline'
    steps:
      - name: Download already-verified APK artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o /tmp/emrooz-artifact.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip"
          mkdir artifact
          unzip -q /tmp/emrooz-artifact.zip -d artifact
          test -f artifact/Emrooz-Final-Full-Offline.apk
          test -f artifact/Emrooz-Final-Full-Offline.apk.sha256
          cd artifact
          sha256sum -c Emrooz-Final-Full-Offline.apk.sha256
          test "$(stat -c%s Emrooz-Final-Full-Offline.apk)" -gt 550000000
          ls -lh Emrooz-Final-Full-Offline.apk

      - name: Create or update public release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifact/Emrooz-Final-Full-Offline.apk artifact/Emrooz-Final-Full-Offline.apk.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" artifact/Emrooz-Final-Full-Offline.apk artifact/Emrooz-Final-Full-Offline.apk.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Emrooz v1.0.2 Full Offline" \
              --notes "Verified full-offline Android APK with bundled Persian speech model."
          fi

      - name: Verify release asset is published
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets,url,tagName | tee /tmp/release.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/release.json'))
          assets={a['name']:a for a in data['assets']}
          assert 'Emrooz-Final-Full-Offline.apk' in assets
          assert assets['Emrooz-Final-Full-Offline.apk']['size'] > 550_000_000
          print(assets['Emrooz-Final-Full-Offline.apk']['url'])
          PY
