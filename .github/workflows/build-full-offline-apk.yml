name: Build Emrooz Full Offline APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Android source
        shell: bash
        run: |
          set -euo pipefail
          cat payload/source.part00 payload/source.part01 | base64 -d > /tmp/emrooz-source.tar.gz
          tar -xzf /tmp/emrooz-source.tar.gz -C .

          # Gradle Kotlin DSL can expose an Android 'java' accessor that shadows java.util.
          sed -i '1i import java.util.Properties' app/build.gradle.kts
          sed -i 's/java\.util\.Properties()/Properties()/' app/build.gradle.kts

          # Keep Java and Kotlin/KAPT on the same JVM target.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          needle = "    compileSdk = 35\n"
          replacement = """    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
"""
          assert needle in s, "compileSdk anchor not found"
          p.write_text(s.replace(needle, replacement, 1))
          PY

          # Use a pure-vector launcher foreground so the build has no binary icon dependency.
          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#25352B"
                  android:pathData="M27,43h54v8H27zM34,57h40v7H34zM42,70h24v6H42z" />
          </vector>
          EOF

          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate release signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing
          keytool -genkeypair -v \
            -keystore signing/emrooz-release.jks \
            -storepass Emrooz2026Release \
            -alias emrooz \
            -keypass Emrooz2026Release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Emrooz, OU=Android, O=Emrooz, C=IR"
          keytool -list -keystore signing/emrooz-release.jks -storepass Emrooz2026Release -alias emrooz

      - name: Download pinned Shenava 459MB Persian model
        shell: bash
        run: |
          set -euo pipefail
          MODEL_DIR="app/src/main/assets/models/shenava_v10_ctc"
          mkdir -p "$MODEL_DIR"
          MODEL_URL="https://huggingface.co/Reza2kn/Shenava-Koochik-v1.0-sherpa-onnx/resolve/f063f38cb38fe02df39887ac65c441b755ab25a2/model.onnx?download=true"
          TOKENS_URL="https://huggingface.co/Reza2kn/Shenava-Koochik-v1.0-sherpa-onnx/resolve/f063f38cb38fe02df39887ac65c441b755ab25a2/tokens.txt?download=true"
          curl -L --fail --retry 5 --retry-all-errors --connect-timeout 30 \
            -H "User-Agent: Mozilla/5.0" \
            -o "$MODEL_DIR/model.onnx" "$MODEL_URL"
          curl -L --fail --retry 5 --retry-all-errors --connect-timeout 30 \
            -H "User-Agent: Mozilla/5.0" \
            -o "$MODEL_DIR/tokens.txt" "$TOKENS_URL"
          echo "6a564b5541920ce1c37bbc91d22e4b3a6838648b9b327eb88997e8db1f90950d  $MODEL_DIR/model.onnx" | sha256sum -c -
          test "$(stat -c%s "$MODEL_DIR/model.onnx")" -gt 450000000
          echo "Model bytes: $(stat -c%s "$MODEL_DIR/model.onnx")"
          echo "Tokens bytes: $(stat -c%s "$MODEL_DIR/tokens.txt")"

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify final APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"
          unzip -l "$APK" | grep 'assets/models/shenava_v10_ctc/model.onnx'
          unzip -l "$APK" | grep 'assets/models/shenava_v10_ctc/tokens.txt'
          MODEL_IN_APK=$(unzip -l "$APK" | awk '/assets\/models\/shenava_v10_ctc\/model.onnx/{print $1}')
          test "$MODEL_IN_APK" -gt 450000000
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee /tmp/apk-permissions.txt
          grep -q 'android.permission.RECORD_AUDIO' /tmp/apk-permissions.txt
          ! grep -q 'android.permission.INTERNET' /tmp/apk-permissions.txt
          cp "$APK" Emrooz-Final-Full-Offline.apk
          sha256sum Emrooz-Final-Full-Offline.apk | tee Emrooz-Final-Full-Offline.apk.sha256

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: Emrooz-Final-Full-Offline-APK
          path: |
            Emrooz-Final-Full-Offline.apk
            Emrooz-Final-Full-Offline.apk.sha256
          compression-level: 0
          retention-days: 30

      - name: Preserve signing key for future updates
        uses: actions/upload-artifact@v4
        with:
          name: Emrooz-Signing-Key
          path: signing/emrooz-release.jks
          retention-days: 30
