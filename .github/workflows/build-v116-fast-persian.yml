name: Build Emrooz v1.1.6 Fast Persian

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-v116-fast-persian.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source and apply v1.1.6 fixes
        shell: bash
        run: |
          set -euo pipefail
          cat payload/v110.part* | base64 -d > /tmp/base.tar.gz
          tar -xzf /tmp/base.tar.gz -C .

          # Recover all complete files from the later vNext upload. Its tail is truncated,
          # but the complete RNNT recognizer, UI, theme and Persian editor are recoverable.
          cat patch/vnext.part* | base64 -d > /tmp/vnext.gz
          gzip -dc /tmp/vnext.gz > /tmp/vnext.tar 2>/dev/null || true
          tar -xf /tmp/vnext.tar -C . --ignore-zeros 2>/dev/null || true

          UI='app/src/main/java/com/nameemrooz/journal/ui/NameEmroozApp.kt'
          sed -i '/^import androidx\.compose\.foundation\.layout\.matchParentSize$/d' "$UI" || true
          sed -i '/^import androidx\.compose\.foundation\.layout\.weight$/d' "$UI" || true

          # Smaller Android 12+ system splash logo.
          mkdir -p app/src/main/res/drawable app/src/main/res/values-v31
          cat > app/src/main/res/drawable/splash_logo_small.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item
                  android:width="112dp"
                  android:height="112dp"
                  android:gravity="center"
                  android:drawable="@drawable/emrooz_logo" />
          </layer-list>
          EOF
          sed -i 's/^          //' app/src/main/res/drawable/splash_logo_small.xml

          python3 - <<'PY'
          from pathlib import Path
          import re

          # Point any Android 12 splash icon declaration to the smaller inset drawable.
          hits = 0
          for p in Path('app/src/main/res').glob('values-v31/*.xml'):
              s = p.read_text(encoding='utf-8')
              ns, n = re.subn(r'(<item\s+name="(?:android:)?windowSplashScreenAnimatedIcon"\s*>).*?(</item>)',
                               r'\1@drawable/splash_logo_small\2', s, flags=re.S)
              if n:
                  p.write_text(ns, encoding='utf-8')
                  hits += n

          # Also reduce the app's own intro logo if that composable gives it an explicit large size.
          ui = Path('app/src/main/java/com/nameemrooz/journal/ui/NameEmroozApp.kt')
          s = ui.read_text(encoding='utf-8')
          idx = s.find('R.drawable.emrooz_logo')
          if idx >= 0:
              a, b = max(0, idx - 700), min(len(s), idx + 1000)
              seg = s[a:b]
              seg2, n1 = re.subn(r'\.size\(\s*\d+(?:\.\d+)?\.dp\s*\)', '.size(124.dp)', seg, count=1)
              if n1 == 0:
                  seg2, _ = re.subn(r'\.fillMaxWidth\(\s*0?\.\d+f?\s*\)', '.fillMaxWidth(0.46f)', seg, count=1)
              s = s[:a] + seg2 + s[b:]
              ui.write_text(s, encoding='utf-8')

          # Add conservative spelling/orthography repairs without paraphrasing the speaker.
          p = Path('app/src/main/java/com/nameemrooz/journal/util/PersianText.kt')
          s = p.read_text(encoding='utf-8')
          marker = '    private val phraseFixes = listOf(\n'
          additions = '''        "می خام" to "می‌خوام", "میخام" to "می‌خوام",\n        "می خاد" to "می‌خواد", "میخاد" to "می‌خواد",\n        "می خواد" to "می‌خواد", "میخواد" to "می‌خواد",\n        "پیاده روی" to "پیاده‌روی",\n        "خونه ی" to "خونه‌ی", "خانه ی" to "خانه‌ی",\n        "بعدشم" to "بعدش هم", "قبلشم" to "قبلش هم",\n        "واقعا" to "واقعاً", "حتما" to "حتماً", "اصلا" to "اصلاً",\n'''
          if '"میخام" to "می‌خوام"' not in s:
              s = s.replace(marker, marker + additions, 1)
          p.write_text(s, encoding='utf-8')

          print('system splash declarations patched:', hits)
          PY

          # Small pure-Kotlin audio buffer used by the segmenter so capture never blocks on decoding.
          cat > app/src/main/java/com/nameemrooz/journal/util/AudioWindowBuffer.kt <<'EOF'
          package com.nameemrooz.journal.util

          class AudioWindowBuffer(
              private val windowSamples: Int,
              private val overlapSamples: Int
          ) {
              init {
                  require(windowSamples > 0)
                  require(overlapSamples in 0 until windowSamples)
              }

              private var data = ShortArray(windowSamples * 2)
              private var size = 0

              val availableSamples: Int get() = size

              fun append(chunk: ShortArray) {
                  if (chunk.isEmpty()) return
                  ensureCapacity(size + chunk.size)
                  System.arraycopy(chunk, 0, data, size, chunk.size)
                  size += chunk.size
              }

              fun pollWindow(): ShortArray? {
                  if (size < windowSamples) return null
                  val out = data.copyOfRange(0, windowSamples)
                  val keepStart = windowSamples - overlapSamples
                  val remaining = size - keepStart
                  System.arraycopy(data, keepStart, data, 0, remaining)
                  if (size > remaining) java.util.Arrays.fill(data, remaining, size, 0.toShort())
                  size = remaining
                  return out
              }

              fun takeAll(): ShortArray {
                  if (size == 0) return ShortArray(0)
                  val out = data.copyOfRange(0, size)
                  java.util.Arrays.fill(data, 0, size, 0.toShort())
                  size = 0
                  return out
              }

              fun reset() {
                  java.util.Arrays.fill(data, 0, size, 0.toShort())
                  size = 0
              }

              private fun ensureCapacity(required: Int) {
                  if (required <= data.size) return
                  data = data.copyOf(maxOf(required, data.size * 2))
              }
          }
          EOF
          sed -i 's/^          //' app/src/main/java/com/nameemrooz/journal/util/AudioWindowBuffer.kt

          # Continuous capture -> lightweight segmenter -> RNNT decoder.
          # Decoding is no longer allowed to block AudioRecord reads.
          cat > app/src/main/java/com/nameemrooz/journal/speech/LiveSpeechEngine.kt <<'EOF'
          package com.nameemrooz.journal.speech

          import android.Manifest
          import android.content.Context
          import android.content.pm.PackageManager
          import android.media.AudioFormat
          import android.media.AudioRecord
          import android.media.MediaRecorder
          import android.os.Handler
          import android.os.Looper
          import androidx.core.content.ContextCompat
          import com.nameemrooz.journal.util.AudioWindowBuffer
          import com.nameemrooz.journal.util.PersianText
          import com.nameemrooz.journal.util.TranscriptMerger
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.cancel
          import kotlinx.coroutines.channels.Channel
          import kotlinx.coroutines.launch
          import java.util.concurrent.atomic.AtomicBoolean
          import kotlin.math.max
          import kotlin.math.sqrt

          /** Microphone audio is RAM-only. No microphone samples are written to disk. */
          class LiveSpeechEngine(
              private val context: Context,
              private val onText: (String) -> Unit,
              private val onListening: (Boolean) -> Unit,
              private val onReady: (Boolean) -> Unit,
              private val onError: (String) -> Unit
          ) : AutoCloseable {
              private val scope = CoroutineScope(SupervisorJob() + Dispatchers.Default)
              private val mainHandler = Handler(Looper.getMainLooper())
              private val running = AtomicBoolean(false)
              private val stopRequested = AtomicBoolean(false)
              private val preparing = AtomicBoolean(false)

              private var recognizer: ShenavaRecognizer? = null
              private var audioRecord: AudioRecord? = null
              private var captureJob: Job? = null
              private var segmentJob: Job? = null
              private var decodeJob: Job? = null

              private val sampleRate = 16000
              private val windowSamples = (sampleRate * 1.60f).toInt()
              private val overlapSamples = (sampleRate * 0.50f).toInt()
              private val pauseSilenceSamples = (sampleRate * 0.62f).toInt()
              private val minPauseSegmentSamples = (sampleRate * 0.90f).toInt()
              private val minTailSamples = (sampleRate * 0.32f).toInt()
              private val silenceRmsThreshold = 0.0115

              private data class DecodeRequest(val samples: ShortArray, val finalizePhrase: Boolean)

              fun prepare() {
                  if (recognizer != null) {
                      emitReady(true)
                      return
                  }
                  if (!preparing.compareAndSet(false, true)) return
                  emitReady(false)
                  scope.launch {
                      try {
                          val loaded = ShenavaRecognizer(context)
                          if (recognizer == null) recognizer = loaded else loaded.close()
                          emitReady(true)
                      } catch (_: Throwable) {
                          emitReady(false)
                          emitError("مدل فارسی آماده نشد")
                      } finally {
                          preparing.set(false)
                      }
                  }
              }

              fun start() {
                  if (running.get()) return
                  val activeRecognizer = recognizer
                  if (activeRecognizer == null) {
                      prepare()
                      emitError("چند لحظه صبر کن تا نوشتن آماده شود")
                      return
                  }
                  if (ContextCompat.checkSelfPermission(context, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      emitError("برای نوشتن با صدا اجازه‌ی میکروفون لازم است")
                      return
                  }

                  val minBuffer = AudioRecord.getMinBufferSize(
                      sampleRate,
                      AudioFormat.CHANNEL_IN_MONO,
                      AudioFormat.ENCODING_PCM_16BIT
                  )
                  if (minBuffer <= 0) {
                      emitError("میکروفون آماده نشد")
                      return
                  }

                  val record = AudioRecord(
                      MediaRecorder.AudioSource.VOICE_RECOGNITION,
                      sampleRate,
                      AudioFormat.CHANNEL_IN_MONO,
                      AudioFormat.ENCODING_PCM_16BIT,
                      max(minBuffer * 4, 32768)
                  )
                  if (record.state != AudioRecord.STATE_INITIALIZED) {
                      record.release()
                      emitError("میکروفون آماده نشد")
                      return
                  }

                  val captureChannel = Channel<ShortArray>(Channel.UNLIMITED)
                  val decodeChannel = Channel<DecodeRequest>(Channel.UNLIMITED)
                  val buffer = AudioWindowBuffer(windowSamples, overlapSamples)

                  stopRequested.set(false)
                  running.set(true)
                  audioRecord = record

                  decodeJob = scope.launch(Dispatchers.Default) {
                      var committed = ""
                      try {
                          for (request in decodeChannel) {
                              val floatSamples = FloatArray(request.samples.size)
                              for (i in request.samples.indices) floatSamples[i] = request.samples[i] / 32768.0f
                              java.util.Arrays.fill(request.samples, 0.toShort())
                              try {
                                  val raw = activeRecognizer.transcribe(floatSamples)
                                  val clean = PersianText.clean(raw, final = request.finalizePhrase)
                                  if (clean.isNotBlank()) {
                                      committed = TranscriptMerger.merge(committed, clean)
                                      emitText(committed)
                                  }
                              } finally {
                                  java.util.Arrays.fill(floatSamples, 0f)
                              }
                          }
                          if (committed.isNotBlank()) emitText(PersianText.clean(committed, final = true))
                      } catch (_: Throwable) {
                          emitError("تبدیل صدا به متن انجام نشد")
                      } finally {
                          running.set(false)
                      }
                  }

                  segmentJob = scope.launch(Dispatchers.Default) {
                      var silenceSamples = 0
                      var heardSpeech = false
                      try {
                          for (chunk in captureChannel) {
                              buffer.append(chunk)

                              var squareSum = 0.0
                              for (v0 in chunk) {
                                  val v = v0.toDouble() / 32768.0
                                  squareSum += v * v
                              }
                              val rms = if (chunk.isNotEmpty()) sqrt(squareSum / chunk.size) else 0.0
                              if (rms < silenceRmsThreshold) {
                                  if (heardSpeech) silenceSamples += chunk.size
                              } else {
                                  heardSpeech = true
                                  silenceSamples = 0
                              }
                              java.util.Arrays.fill(chunk, 0.toShort())

                              val pauseBoundary = heardSpeech &&
                                  silenceSamples >= pauseSilenceSamples &&
                                  buffer.availableSamples >= minPauseSegmentSamples

                              if (pauseBoundary) {
                                  val phrase = buffer.takeAll()
                                  if (phrase.size >= minTailSamples) decodeChannel.send(DecodeRequest(phrase, true))
                                  silenceSamples = 0
                                  heardSpeech = false
                              } else {
                                  while (true) {
                                      val window = buffer.pollWindow() ?: break
                                      decodeChannel.send(DecodeRequest(window, false))
                                  }
                              }
                          }
                      } finally {
                          val tail = buffer.takeAll()
                          if (tail.size >= minTailSamples) decodeChannel.send(DecodeRequest(tail, true))
                          else java.util.Arrays.fill(tail, 0.toShort())
                          decodeChannel.close()
                      }
                  }

                  captureJob = scope.launch(Dispatchers.IO) {
                      val readBuffer = ShortArray(2048)
                      try {
                          record.startRecording()
                          emitListening(true)
                          while (!stopRequested.get()) {
                              val n = record.read(readBuffer, 0, readBuffer.size, AudioRecord.READ_BLOCKING)
                              if (n <= 0) {
                                  if (stopRequested.get()) break
                                  continue
                              }
                              captureChannel.send(readBuffer.copyOf(n))
                              java.util.Arrays.fill(readBuffer, 0, n, 0.toShort())
                          }
                      } catch (_: Throwable) {
                          if (!stopRequested.get()) emitError("تبدیل صدا به متن انجام نشد")
                      } finally {
                          java.util.Arrays.fill(readBuffer, 0.toShort())
                          try { record.stop() } catch (_: Throwable) {}
                          record.release()
                          audioRecord = null
                          captureChannel.close()
                          emitListening(false)
                      }
                  }
              }

              fun stop() {
                  stopRequested.set(true)
                  try { audioRecord?.stop() } catch (_: Throwable) {}
              }

              private fun emitText(value: String) = mainHandler.post { onText(value) }
              private fun emitListening(value: Boolean) = mainHandler.post { onListening(value) }
              private fun emitReady(value: Boolean) = mainHandler.post { onReady(value) }
              private fun emitError(value: String) = mainHandler.post { onError(value) }

              override fun close() {
                  stopRequested.set(true)
                  try { audioRecord?.stop() } catch (_: Throwable) {}
                  captureJob?.cancel()
                  segmentJob?.cancel()
                  decodeJob?.cancel()
                  try { audioRecord?.release() } catch (_: Throwable) {}
                  audioRecord = null
                  try { recognizer?.close() } catch (_: Throwable) {}
                  recognizer = null
                  running.set(false)
                  scope.cancel()
              }
          }
          EOF
          sed -i 's/^          //' app/src/main/java/com/nameemrooz/journal/speech/LiveSpeechEngine.kt

          # Regression tests for spelling and the overlap-preserving audio window.
          TEST_DIR='app/src/test/java/com/nameemrooz/journal/util'
          mkdir -p "$TEST_DIR"
          cat > "$TEST_DIR/PersianEditorV116Test.kt" <<'EOF'
          package com.nameemrooz.journal.util

          import org.junit.Assert.assertEquals
          import org.junit.Test

          class PersianEditorV116Test {
              @Test fun fixes_common_spelling_without_changing_meaning() {
                  assertEquals("من می‌خوام فردا حتماً برم.", PersianText.clean("من میخام فردا حتما برم", final = true))
                  assertEquals("امروز رفتم خونه‌ی دخترم و پیاده‌روی کردیم.", PersianText.clean("امروز رفتم خونه ی دخترم و پیاده روی کردیم", final = true))
                  assertEquals("واقعاً خوب بود.", PersianText.clean("واقعا خوب بود", final = true))
              }

              @Test fun preserves_vnext_question_and_colloquial_rules() {
                  assertEquals("دلت خوشه آ.", PersianText.clean("دلت خوش آ", final = true))
                  assertEquals("چرا امروز نیومدی؟", PersianText.clean("چرا امروز نیومدی", final = true))
              }
          }
          EOF
          sed -i 's/^          //' "$TEST_DIR/PersianEditorV116Test.kt"

          cat > "$TEST_DIR/AudioWindowBufferV116Test.kt" <<'EOF'
          package com.nameemrooz.journal.util

          import org.junit.Assert.assertArrayEquals
          import org.junit.Assert.assertNull
          import org.junit.Test

          class AudioWindowBufferV116Test {
              @Test fun keeps_overlap_without_dropping_new_samples() {
                  val b = AudioWindowBuffer(windowSamples = 8, overlapSamples = 2)
                  b.append(shortArrayOf(1, 2, 3, 4, 5))
                  assertNull(b.pollWindow())
                  b.append(shortArrayOf(6, 7, 8, 9, 10))
                  assertArrayEquals(shortArrayOf(1,2,3,4,5,6,7,8), b.pollWindow())
                  b.append(shortArrayOf(11,12,13,14))
                  assertArrayEquals(shortArrayOf(7,8,9,10,11,12,13,14), b.pollWindow())
                  assertArrayEquals(shortArrayOf(13,14), b.takeAll())
              }
          }
          EOF
          sed -i 's/^          //' "$TEST_DIR/AudioWindowBufferV116Test.kt"

          sed -i 's/versionCode = [0-9][0-9]*/versionCode = 16/' app/build.gradle.kts
          sed -i 's/versionName = "[^"]*"/versionName = "1.1.6"/' app/build.gradle.kts

          test -f app/src/main/java/com/nameemrooz/journal/speech/ShenavaRecognizer.kt
          grep -q 'models/shenava_v15_rnnt_int8' app/src/main/java/com/nameemrooz/journal/speech/ShenavaRecognizer.kt
          grep -q 'Channel<ShortArray>(Channel.UNLIMITED)' app/src/main/java/com/nameemrooz/journal/speech/LiveSpeechEngine.kt
          grep -q 'Dispatchers.IO' app/src/main/java/com/nameemrooz/journal/speech/LiveSpeechEngine.kt
          grep -q 'splash_logo_small' app/src/main/res/drawable/splash_logo_small.xml
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Download Shenava v1.5 RNNT INT8 model
        shell: bash
        run: |
          set -euo pipefail
          D='app/src/main/assets/models/shenava_v15_rnnt_int8'
          mkdir -p "$D"
          BASE='https://huggingface.co/Reza2kn/Shenava-Koochik-v1.5-RNNT-sherpa-onnx/resolve/main'
          curl -L --fail --retry 5 --retry-all-errors -o "$D/encoder.int8.onnx" "$BASE/encoder.int8.onnx?download=true"
          curl -L --fail --retry 5 --retry-all-errors -o "$D/decoder.int8.onnx" "$BASE/decoder.int8.onnx?download=true"
          curl -L --fail --retry 5 --retry-all-errors -o "$D/joiner.int8.onnx" "$BASE/joiner.int8.onnx?download=true"
          curl -L --fail --retry 5 --retry-all-errors -o "$D/tokens.txt" "$BASE/tokens.txt?download=true"
          test "$(stat -c%s "$D/encoder.int8.onnx")" -gt 120000000
          test "$(stat -c%s "$D/decoder.int8.onnx")" -gt 3000000
          test "$(stat -c%s "$D/joiner.int8.onnx")" -gt 1000000
          test "$(stat -c%s "$D/tokens.txt")" -gt 8000
          sha256sum "$D"/* | tee model-files.sha256

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:testReleaseUnitTest

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)
          test -n "$UNSIGNED"
          keytool -genkeypair -v -keystore /tmp/emrooz-v116.jks -storepass EmroozV116Build -alias emrooz -keypass EmroozV116Build -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Emrooz, O=Emrooz, C=IR"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 "$UNSIGNED" /tmp/emrooz-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks /tmp/emrooz-v116.jks --ks-pass pass:EmroozV116Build --key-pass pass:EmroozV116Build --out Emrooz-v1.1.6-Fast-Persian.apk /tmp/emrooz-aligned.apk
          APK='Emrooz-v1.1.6-Fast-Persian.apk'
          unzip -t "$APK"
          unzip -l "$APK" | grep 'assets/models/shenava_v15_rnnt_int8/encoder.int8.onnx'
          unzip -l "$APK" | grep 'assets/models/shenava_v15_rnnt_int8/decoder.int8.onnx'
          unzip -l "$APK" | grep 'assets/models/shenava_v15_rnnt_int8/joiner.int8.onnx'
          unzip -l "$APK" | grep 'assets/models/shenava_v15_rnnt_int8/tokens.txt'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee /tmp/permissions.txt
          grep -q 'android.permission.RECORD_AUDIO' /tmp/permissions.txt
          if grep -q 'android.permission.INTERNET' /tmp/permissions.txt; then echo 'Unexpected INTERNET permission' >&2; exit 1; fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionName='1.1.6'" /tmp/badging.txt
          sha256sum "$APK" | tee Emrooz-v1.1.6-Fast-Persian.apk.sha256
          ls -lh "$APK"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Emrooz-v1.1.6-Fast-Persian
          path: |
            Emrooz-v1.1.6-Fast-Persian.apk
            Emrooz-v1.1.6-Fast-Persian.apk.sha256
            model-files.sha256
          compression-level: 0
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='v1.1.6-fast-persian'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" Emrooz-v1.1.6-Fast-Persian.apk Emrooz-v1.1.6-Fast-Persian.apk.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" Emrooz-v1.1.6-Fast-Persian.apk Emrooz-v1.1.6-Fast-Persian.apk.sha256 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Emrooz v1.1.6 – Fast Persian' --notes 'Faster continuous Persian speech capture, Shenava v1.5 RNNT INT8, conservative Persian spelling/orthography editing, and a smaller splash logo.'
          fi
