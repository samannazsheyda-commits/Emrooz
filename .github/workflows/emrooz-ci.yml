name: Emrooz complete Android verification

on:
  workflow_dispatch:
  push:
    branches: ['work/emrooz-complete-*']
    paths: ['app/**', 'tools/**', '*.gradle.kts', 'gradle.properties', '.github/workflows/emrooz-ci.yml']
  pull_request:
    paths: ['app/**', 'tools/**', '*.gradle.kts', 'gradle.properties', '.github/workflows/emrooz-ci.yml']

permissions:
  contents: read

concurrency:
  group: emrooz-complete-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Cache checksum-verified bundled models
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models
          key: emrooz-models-${{ hashFiles('app/build.gradle.kts') }}
      - name: Unit tests, lint and signed arm64 preview
        run: gradle --no-daemon -PemroozPreview :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
      - name: Verify APK, privacy and model integrity
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Emrooz-2.2.2-Nano-Preview-arm64.apk
          python3 tools/verify-apk.py out/Emrooz-2.2.2-Nano-Preview-arm64.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --verbose --print-certs out/*.apk >out/signature.txt
          "$BT/zipalign" -c -v 4 out/*.apk >out/alignment.txt
          "$BT/aapt" dump permissions out/*.apk >out/permissions.txt
          "$BT/aapt" dump badging out/*.apk >out/badging.txt
          ! grep -q android.permission.INTERNET out/permissions.txt
          grep -q "versionCode='38' versionName='2.2.2'" out/badging.txt
          grep -q "package: name='com.nameemrooz.journal.preview'" out/badging.txt
          sha256sum out/*.apk >out/sha256.txt
      - name: Build emulator and real UI tests
        run: gradle --no-daemon -PemroozPreview -PemroozAbi=x86_64 :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android journal flow and lifecycle verification
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072
          script: bash tools/android-ui-check.sh
      - name: Print Android failure details
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('app/build/outputs/androidTest-results').rglob('*.xml'):
              print(path)
              print(path.read_text()[:20000])
          PY
      - name: Record honest QA status
        run: |
          cat >out/QA.txt <<'EOF'
          Emrooz 2.2.2 preview
          Unit tests, release lint/build, signatures, alignment, privacy/model checks and Android journal UI flow passed.
          Google editing is enabled by default, on-device and lazy; unsupported/error/timeout fallback is tested.
          Successful Nano inference still requires supported physical-device validation.
          This preview uses a separate application ID and a CI debug certificate. It does not replace the installed production app or its notes.
          A production update requires the original signing key; no signing key is included in the artifacts.
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Emrooz-2.2.2-api-${{ matrix.api }}-preview-and-verification
          path: |
            out/
            app/build/reports/tests/
            app/build/reports/lint-results-release.*
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 30
          compression-level: 0
