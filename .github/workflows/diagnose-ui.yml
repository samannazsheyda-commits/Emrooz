name: Diagnose Emrooz Editor and Text

on:
  push:
    branches: [ fix/editor-names-v112 ]
    paths:
      - '.github/workflows/diagnose-ui.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and inspect relevant source
        shell: bash
        run: |
          set -euo pipefail
          cat payload/v110.part* | base64 -d > /tmp/emrooz-source.tar.gz
          tar -xzf /tmp/emrooz-source.tar.gz -C .
          UI="app/src/main/java/com/nameemrooz/journal/ui/NameEmroozApp.kt"
          CLEAN="app/src/main/java/com/nameemrooz/journal/util/PersianText.kt"
          echo '--- PersianText ---'
          nl -ba "$CLEAN" | sed -n '1,280p' || true
          echo '--- TranscriptEditor and action buttons ---'
          nl -ba "$UI" | sed -n '250,450p' || true
          echo '--- Theme and typography references ---'
          grep -RIn --exclude='*.png' --exclude='*.jpg' --exclude='*.onnx' -E 'FontFamily|fontFamily|Typography|نامه|Sheida|Doran|Peyda|IRANSans|Vazir|Dana|Yekan|Sahel|Estedad' app/src/main 2>/dev/null | head -n 250 || true
          echo '--- Font/resource files ---'
          find app/src/main -type f \( -iname '*.ttf' -o -iname '*.otf' -o -iname '*.woff' -o -iname '*.woff2' \) -print || true
          echo '--- Gradle speech/model deps ---'
          grep -n -E 'sherpa|onnx|versionName|versionCode' app/build.gradle.kts || true