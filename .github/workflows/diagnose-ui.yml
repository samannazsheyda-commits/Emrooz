name: Diagnose Emrooz Final Source

on:
  push:
    branches: [ feat/final-ui-stt-v113 ]
    paths:
      - '.github/workflows/diagnose-ui.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact current source
        shell: bash
        run: |
          set -euo pipefail
          cat payload/v110.part* | base64 -d > /tmp/emrooz-source.tar.gz
          echo "3c0dfc2159467bf457f7235a8377dde233acebd637b68e6717836b4ebcdd5bee  /tmp/emrooz-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/emrooz-source.tar.gz -C .
          UI="app/src/main/java/com/nameemrooz/journal/ui/NameEmroozApp.kt"
          sed -i '/^import androidx\.compose\.foundation\.layout\.matchParentSize$/d' "$UI"
          sed -i '/^import androidx\.compose\.foundation\.layout\.weight$/d' "$UI"
          if [ -d fixes/app ]; then cp -a fixes/app/. app/; fi
          python3 fixes/apply_ui_patch.py

      - name: Print exact integration points
        shell: bash
        run: |
          set -euo pipefail
          echo '--- AppViewModel ---'
          nl -ba app/src/main/java/com/nameemrooz/journal/ui/AppViewModel.kt | sed -n '1,220p'
          echo '--- TitleGenerator ---'
          nl -ba app/src/main/java/com/nameemrooz/journal/util/TitleGenerator.kt | sed -n '1,220p'
          echo '--- Home / Splash ---'
          grep -n -E 'Splash|Home\(|TranscriptEditor\(|نامه امروزت|از امروزت بگو|هر چیزی|DraftActionButton|Detail\(' app/src/main/java/com/nameemrooz/journal/ui/NameEmroozApp.kt || true
          echo '--- Home lines 100-360 ---'
          nl -ba app/src/main/java/com/nameemrooz/journal/ui/NameEmroozApp.kt | sed -n '100,360p'
          echo '--- Editor/detail lines 360-620 ---'
          nl -ba app/src/main/java/com/nameemrooz/journal/ui/NameEmroozApp.kt | sed -n '360,620p'

      - name: Prepare source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p exact-source
          cp app/src/main/java/com/nameemrooz/journal/ui/NameEmroozApp.kt exact-source/
          cp app/src/main/java/com/nameemrooz/journal/ui/AppViewModel.kt exact-source/
          cp app/src/main/java/com/nameemrooz/journal/util/TitleGenerator.kt exact-source/
          cp app/src/main/java/com/nameemrooz/journal/model/JournalEntry.kt exact-source/
          cp app/src/main/java/com/nameemrooz/journal/data/JournalRepository.kt exact-source/
          cp app/src/main/java/com/nameemrooz/journal/speech/LiveSpeechEngine.kt exact-source/
          cp app/src/main/java/com/nameemrooz/journal/speech/ShenavaRecognizer.kt exact-source/
          cp app/build.gradle.kts exact-source/app-build.gradle.kts

      - name: Upload exact source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: Emrooz-v113-exact-source
          path: exact-source/
          retention-days: 7