name: Diagnose Emrooz Editor and Text

on:
  push:
    branches: [ fix/editor-names-v112 ]
    paths:
      - '.github/workflows/diagnose-ui.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and inspect relevant source
        shell: bash
        run: |
          set -euo pipefail
          cat payload/v110.part* | base64 -d > /tmp/emrooz-source.tar.gz
          tar -xzf /tmp/emrooz-source.tar.gz -C .
          UI="app/src/main/java/com/nameemrooz/journal/ui/NameEmroozApp.kt"
          CLEAN="app/src/main/java/com/nameemrooz/journal/util/PersianText.kt"
          TEST="app/src/test/java/com/nameemrooz/journal/util/PersianTextTest.kt"
          echo '--- PersianText legacy tests ---'
          nl -ba "$TEST" | sed -n '1,240p' || true
          echo '--- UI imports/font declarations ---'
          nl -ba "$UI" | sed -n '1,145p' || true
          echo '--- TranscriptEditor and actions ---'
          nl -ba "$UI" | sed -n '250,475p' || true
          echo '--- Theme ---'
          nl -ba app/src/main/java/com/nameemrooz/journal/ui/theme/Theme.kt | sed -n '1,180p' || true
          echo '--- First-name data sample ---'
          curl -L --fail --silent 'https://raw.githubusercontent.com/nabidam/persian-names/main/names_1.csv' | head -n 8 || true
          echo '--- Surname data sample ---'
          curl -L --fail --silent 'https://raw.githubusercontent.com/farbodbj/iranian-surname-frequencies/github-master/iranian-surname-frequencies.csv' | head -n 8 || true
          echo '--- Font/resource files ---'
          find app/src/main -type f \( -iname '*.ttf' -o -iname '*.otf' -o -iname '*.woff' -o -iname '*.woff2' \) -print || true
          echo '--- Gradle versions ---'
          grep -n -E 'versionName|versionCode' app/build.gradle.kts || true