name: Build and Publish Emrooz v1.1.6 Final

on:
  push:
    branches: [fix/final-v116-repair]
    paths:
      - 'payload/v116.vec.*'
      - '.github/workflows/build-v116-final.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: Asia/Tehran

jobs:
  verify-build-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact verified v1.1.4 source
        shell: bash
        run: |
          set -euo pipefail
          cat payload/v110.part* | base64 -d > /tmp/base.tgz
          echo '3c0dfc2159467bf457f7235a8377dde233acebd637b68e6717836b4ebcdd5bee  /tmp/base.tgz' | sha256sum -c -
          tar -xzf /tmp/base.tgz -C .
          UI='app/src/main/java/com/nameemrooz/journal/ui/NameEmroozApp.kt'
          sed -i '/^import androidx\.compose\.foundation\.layout\.matchParentSize$/d' "$UI"
          sed -i '/^import androidx\.compose\.foundation\.layout\.weight$/d' "$UI"
          if [ -d fixes/app ]; then cp -a fixes/app/. app/; fi
          python3 fixes/apply_text_patch.py
          python3 fixes/apply_ui_patch.py
          cat payload/v114.part* | base64 -d > /tmp/v114.tgz
          echo 'a6cd02a6695a5f2421c5243cceaddc34b6d3fb8f7336bda6c7c493b75e83c4c7  /tmp/v114.tgz' | sha256sum -c -
          tar -xzf /tmp/v114.tgz -C .
          sed -i '/^import androidx\.compose\.foundation\.layout\.weight$/d' "$UI"

      - name: RED proof on previous source
        shell: bash
        run: |
          set -euo pipefail
          UI='app/src/main/java/com/nameemrooz/journal/ui/NameEmroozApp.kt'
          SPEECH='app/src/main/java/com/nameemrooz/journal/speech/LiveSpeechEngine.kt'
          if grep -q 'view.keepScreenOn = keepScreenAwake' "$UI"; then
            echo 'RED failed: previous source unexpectedly already keeps screen awake' >&2; exit 1
          fi
          if ! grep -q 'TitleGenerator' "$UI"; then
            echo 'RED failed: previous source unexpectedly already removed title generation' >&2; exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/java/com/nameemrooz/journal/speech/LiveSpeechEngine.kt').read_text()
          marker='val streamingFinal = PersianText.clean(activeRecognizer.finish(), final = true)'
          assert marker in s
          tail=s[s.index(marker):]
          offline=tail.index('ShenavaOfflineRecognizer')
          assert 'emitText(quickFinal)' not in tail[:offline], 'previous source unexpectedly emits quick final before offline pass'
          print('Expected RED conditions confirmed')
          PY

      - name: Apply v1.1.6 repaired overlay
        shell: bash
        run: |
          set -euo pipefail
          cat payload/v116.vec.* > /tmp/v116.vec.b64
          test "$(wc -c < /tmp/v116.vec.b64)" -eq 171024
          echo '2a0cde7c006f090bea54ec4aac7cff82839340ed140893e64dec36183ca73f22  /tmp/v116.vec.b64' | sha256sum -c -
          base64 -d /tmp/v116.vec.b64 > /tmp/v116.tgz
          echo '468b2c892f05ffa25f6a59597fa0405d1903303f407656d52fe14814425caebd  /tmp/v116.tgz' | sha256sum -c -
          tar -xzf /tmp/v116.tgz -C .

      - name: Add v1.1.6 regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/test/java/com/nameemrooz/journal/util app/src/test/java/com/nameemrooz/journal/ui
          cat > app/src/test/java/com/nameemrooz/journal/util/JalaliDateNaturalArchiveTest.kt <<'KOT'
          package com.nameemrooz.journal.util

          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertFalse
          import org.junit.Test
          import java.util.Calendar
          import java.util.TimeZone

          class JalaliDateNaturalArchiveTest {
              @Test fun archiveStampUsesNaturalPersianDateAndTime() {
                  val old = TimeZone.getDefault()
                  try {
                      TimeZone.setDefault(TimeZone.getTimeZone("Asia/Tehran"))
                      val cal = Calendar.getInstance().apply {
                          set(2026, Calendar.AUGUST, 29, 18, 7, 0)
                          set(Calendar.MILLISECOND, 0)
                      }
                      val value = JalaliDate.archiveStamp(cal.timeInMillis)
                      assertEquals("شنبه هفتم شهریور هزار و چهارصد و پنج، ساعت ۱۸:۰۷", value)
                      assertFalse(value.contains("•"))
                      assertFalse(value.any { it in '0'..'9' })
                  } finally {
                      TimeZone.setDefault(old)
                  }
              }
          }
          KOT
          cat > app/src/test/java/com/nameemrooz/journal/ui/RecordingPowerPolicyTest.kt <<'KOT'
          package com.nameemrooz.journal.ui

          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class RecordingPowerPolicyTest {
              @Test fun screenStaysAwakeWhileRecordingOrFinalizing() {
                  assertTrue(RecordingPowerPolicy.keepScreenAwake(true, false))
                  assertTrue(RecordingPowerPolicy.keepScreenAwake(false, true))
                  assertFalse(RecordingPowerPolicy.keepScreenAwake(false, false))
              }
          }
          KOT

      - name: Bundle unchanged runtime fonts and lexicons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/font app/src/main/assets/lexicon
          curl -L --fail --retry 5 --retry-all-errors --connect-timeout 30 -o app/src/main/res/font/noto_naskh_arabic.ttf 'https://raw.githubusercontent.com/google/fonts/ade3d1533e06b2b1462ffcde8e08b129627ca360/ofl/notonaskharabic/NotoNaskhArabic%5Bwght%5D.ttf'
          curl -L --fail --retry 5 --retry-all-errors --connect-timeout 30 -o app/src/main/res/font/vazirmatn_regular.ttf 'https://raw.githubusercontent.com/rastikerdar/vazirmatn/6e553e33489a8f9dfaccc76860a2e3f3c1e66de7/fonts/ttf/Vazirmatn-Regular.ttf'
          curl -L --fail --retry 5 --retry-all-errors --connect-timeout 30 -o app/src/main/res/font/vazirmatn_semibold.ttf 'https://raw.githubusercontent.com/rastikerdar/vazirmatn/6e553e33489a8f9dfaccc76860a2e3f3c1e66de7/fonts/ttf/Vazirmatn-SemiBold.ttf'
          curl -L --fail --retry 5 --retry-all-errors -o /tmp/names.json 'https://raw.githubusercontent.com/nabidam/persian-names/68f5cb39a25c19ecaf6f60f3181aea200f8206f8/names.json'
          curl -L --fail --retry 5 --retry-all-errors -o /tmp/surnames.csv 'https://raw.githubusercontent.com/farbodbj/iranian-surname-frequencies/9fb2fdccb62445b52e933d4d7929a52e01bd6011/iranian-surname-frequencies.csv'
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          def norm(v): return (v or '').strip().replace('ي','ی').replace('ى','ی').replace('ك','ک').replace('ة','ه')
          lex=Path('app/src/main/assets/lexicon')
          d=json.loads(Path('/tmp/names.json').read_text(encoding='utf-8-sig'))
          names={norm(x) for x in d.keys() if norm(x)}; names.add('سهیل')
          (lex/'persian_first_names.txt').write_text('\n'.join(sorted(names))+'\n',encoding='utf-8')
          surnames={}
          with open('/tmp/surnames.csv',encoding='utf-8-sig',newline='') as f:
              for row in csv.DictReader(f):
                  n=norm(row.get('name',''))
                  if not n: continue
                  try: freq=float(row.get('frequency',0) or 0)
                  except ValueError: freq=0.0
                  surnames[n]=max(surnames.get(n,0),max(1,int(round(freq*1_000_000_000))))
          surnames['ممدوحی']=max(surnames.get('ممدوحی',0),1)
          with (lex/'persian_surnames.tsv').open('w',encoding='utf-8') as f:
              for n,score in sorted(surnames.items()): f.write(f'{n}\t{score}\n')
          PY

      - name: Download and pin unchanged Persian ASR models
        shell: bash
        run: |
          set -euo pipefail
          STREAM='app/src/main/assets/models/shenava_v10_ctc'; FINAL='app/src/main/assets/models/shenava_v10_ctc_offline'
          mkdir -p "$STREAM" "$FINAL"
          get() { out="$1"; primary="$2"; fallback="$3"; rm -f "$out"; curl -L --fail --retry 4 --retry-all-errors --retry-delay 3 --connect-timeout 30 --max-time 900 -A 'Emrooz-v116' -o "$out" "$primary" || { rm -f "$out"; curl -L --fail --retry 8 --retry-all-errors --retry-delay 8 --connect-timeout 30 --max-time 1200 -A 'Emrooz-v116' -o "$out" "$fallback"; }; }
          SR='mah92/sherpa-onnx-nemo-ctc-fa-shenava-koochik-v1.0-streaming-int8-2026-06-26'; REV='ae7a6e0f530d30f3a110e26724dca4efce01a85e'
          FR='mah92/sherpa-onnx-nemo-ctc-fa-shenava-koochik-v1.0-non-streaming-int8-2026-06-26'
          get "$STREAM/model.onnx" "https://hf-mirror.com/$SR/resolve/$REV/model.int8.onnx?download=true" "https://huggingface.co/$SR/resolve/$REV/model.int8.onnx?download=true"
          get "$STREAM/tokens.txt" "https://hf-mirror.com/$SR/resolve/$REV/tokens.txt?download=true" "https://huggingface.co/$SR/resolve/$REV/tokens.txt?download=true"
          get "$FINAL/model.onnx" "https://hf-mirror.com/$FR/resolve/main/model.int8.onnx?download=true" "https://huggingface.co/$FR/resolve/main/model.int8.onnx?download=true"
          get "$FINAL/tokens.txt" "https://hf-mirror.com/$FR/resolve/main/tokens.txt?download=true" "https://huggingface.co/$FR/resolve/main/tokens.txt?download=true"
          echo '439983c95ab83c55c841e0795ba3a61d56718ec5c972a3a208548b93470b04b1  app/src/main/assets/models/shenava_v10_ctc/model.onnx' | sha256sum -c -
          echo '9d487fc2aa8cdb742a6e2f000be4c25e6b620faf73c9a335fdb310cc7879182e  app/src/main/assets/models/shenava_v10_ctc_offline/model.onnx' | sha256sum -c -
          echo '8e192963f6e666dfa5721e5cbd4710bc1ef592460a45f08cefc94b2db16a6954  app/src/main/assets/models/shenava_v10_ctc_offline/tokens.txt' | sha256sum -c -

      - name: Static requirements gate
        shell: bash
        run: |
          set -euo pipefail
          UI='app/src/main/java/com/nameemrooz/journal/ui/NameEmroozApp.kt'
          MAIN='app/src/main/java/com/nameemrooz/journal/MainActivity.kt'
          SPEECH='app/src/main/java/com/nameemrooz/journal/speech/LiveSpeechEngine.kt'
          JALALI='app/src/main/java/com/nameemrooz/journal/util/JalaliDate.kt'
          MAN='app/src/main/AndroidManifest.xml'
          BUILD='app/build.gradle.kts'
          grep -q 'applicationId = "com.nameemrooz.journal.v116final"' "$BUILD"
          grep -q 'versionCode = 19' "$BUILD"
          grep -q 'versionName = "1.1.6"' "$BUILD"
          grep -q 'android:icon="@drawable/app_icon_exact"' "$MAN"
          grep -q 'android:roundIcon="@drawable/app_icon_exact"' "$MAN"
          grep -q 'android.permission.RECORD_AUDIO' "$MAN"
          ! grep -q 'android.permission.INTERNET' "$MAN"
          ! grep -q 'TitleGenerator' "$UI"
          ! grep -q 'var title' "$UI"
          ! grep -q 'entry.title' "$UI"
          ! grep -q 'onTitleChange' "$UI"
          grep -q 'vm.save(text, "")' "$UI"
          grep -q 'view.keepScreenOn = keepScreenAwake' "$UI"
          grep -q 'keepScreenAwake(listening, finalizing)' "$UI"
          grep -q 'R.drawable.splash_logo_exact' "$UI"
          grep -q 'R.drawable.doran_tagline' "$UI"
          grep -q 'R.drawable.doran_today_letter' "$UI"
          grep -q 'val remaining = 3_000L - elapsed' "$MAIN"
          grep -q 'ordinalDay' "$JALALI"
          grep -q 'numberToWords' "$JALALI"
          grep -q '، ساعت ' "$JALALI"
          test -f app/src/main/res/drawable-nodpi/app_icon_exact.xml
          test -f app/src/main/res/drawable-nodpi/splash_logo_exact.xml
          test -f app/src/main/res/drawable-nodpi/doran_today_letter.xml
          test -f app/src/main/res/drawable-nodpi/doran_tagline.xml
          if find app/src/main/res -type f -iname '*doran*.ttf' | grep -q .; then echo 'Raw Doran font unexpectedly packaged' >&2; exit 1; fi
          python3 - <<'PY'
          from pathlib import Path
          ui=Path('app/src/main/java/com/nameemrooz/journal/ui/NameEmroozApp.kt').read_text()
          a=ui.index('fun EmroozPrivacyCover')
          block=ui[a:]
          assert 'R.drawable.splash_logo_exact' in block
          assert 'app_icon_exact' not in block
          speech=Path('app/src/main/java/com/nameemrooz/journal/speech/LiveSpeechEngine.kt').read_text()
          marker='val streamingFinal = PersianText.clean(activeRecognizer.finish(), final = true)'
          tail=speech[speech.index(marker):]
          assert tail.index('emitText(quickFinal)') < tail.index('ShenavaOfflineRecognizer')
          print('Static gates passed')
          PY

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }

      - name: Generate temporary install-safe signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing
          keytool -genkeypair -keystore signing/emrooz-release.jks -storepass Emrooz2026Release -alias emrooz -keypass Emrooz2026Release -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Emrooz v116 CI,OU=Android,O=Emrooz,C=IR'
          cat > signing/keystore.properties <<'EOF'
          storeFile=signing/emrooz-release.jks
          storePassword=Emrooz2026Release
          keyAlias=emrooz
          keyPassword=Emrooz2026Release
          EOF

      - name: Run complete unit suite ten times
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do echo "===== PASS $i/10 ====="; gradle --no-daemon --stacktrace --rerun-tasks :app:testReleaseUnitTest; done

      - name: Android lint
        run: gradle --no-daemon --stacktrace :app:lintRelease

      - name: Build release APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -s "$APK"
          unzip -t "$APK" | tee /tmp/zipcheck
          grep -q 'No errors detected' /tmp/zipcheck
          unzip -l "$APK" | grep -q 'assets/models/shenava_v10_ctc/model.onnx'
          unzip -l "$APK" | grep -q 'assets/models/shenava_v10_ctc_offline/model.onnx'
          unzip -l "$APK" | grep -q 'assets/lexicon/persian_first_names.txt'
          unzip -l "$APK" | grep -q 'assets/lexicon/persian_surnames.tsv'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libsherpa-onnx-jni.so'
          "$AAPT" dump resources "$APK" > /tmp/resources.txt
          grep -q 'app_icon_exact' /tmp/resources.txt
          grep -q 'splash_logo_exact' /tmp/resources.txt
          grep -q 'doran_today_letter' /tmp/resources.txt
          grep -q 'doran_tagline' /tmp/resources.txt
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.nameemrooz.journal.v116final' versionCode='19' versionName='1.1.6'" /tmp/badging.txt
          "$AAPT" dump permissions "$APK" | tee /tmp/perms.txt
          grep -q 'android.permission.RECORD_AUDIO' /tmp/perms.txt
          ! grep -q 'android.permission.INTERNET' /tmp/perms.txt
          "$SIGNER" verify --verbose "$APK" | tee /tmp/sign.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/sign.txt
          mkdir -p deliver
          cp "$APK" deliver/Emrooz-v1.1.6-FINAL.apk
          sha256sum deliver/Emrooz-v1.1.6-FINAL.apk | tee deliver/Emrooz-v1.1.6-FINAL.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Emrooz-v1.1.6-FINAL
          path: deliver/
          compression-level: 0
          retention-days: 14

      - name: Publish public direct-download release
        shell: bash
        run: |
          set -euo pipefail
          TAG='v1.1.6-final'
          APK='deliver/Emrooz-v1.1.6-FINAL.apk'
          SHA='deliver/Emrooz-v1.1.6-FINAL.apk.sha256'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SHA" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" "$SHA" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Emrooz v1.1.6 Final' --notes 'Corrected launcher/splash branding, title-free natural Persian archive date/time, recording screen-awake protection, and faster immediate streaming final while retaining the full-context offline refinement pass.'
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets,url,tagName | tee /tmp/release.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/release.json'))
          assets={a['name']:a for a in data['assets']}
          a=assets['Emrooz-v1.1.6-FINAL.apk']
          assert a['size'] > 250_000_000
          print(a['url'])
          PY
