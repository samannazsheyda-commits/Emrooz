name: Trigger Emrooz v2.0.4 Verified Release

on:
  push:
    paths:
      - '.github/workflows/trigger-v204-release.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch verified v2.0.4 release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-v204-release.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
