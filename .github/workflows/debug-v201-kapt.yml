name: Debug Emrooz v2.0.1 KAPT

on:
  push:
    paths:
      - '.github/workflows/debug-v201-kapt.yml'
  workflow_dispatch:

jobs:
  debug-kapt:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact source
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/transfer.b64
          for i in $(seq 0 27); do printf -v p '%03d' "$i"; cat "payload/v201.part${p}" >> /tmp/transfer.b64; done
          cat payload/v201.part028.a payload/v201.part028.b payload/v201.part028.c payload/v201.part028.d >> /tmp/transfer.b64
          for i in $(seq 29 40); do printf -v p '%03d' "$i"; cat "payload/v201.part${p}" >> /tmp/transfer.b64; done
          tr -d '\r\n' < /tmp/transfer.b64 | base64 -d > /tmp/transfer.tar.xz
          echo '8ee6d03b5243d4818d65daaec44fae8d713231a8e6bf1f51bc4eeafae2db210b  /tmp/transfer.tar.xz' | sha256sum -c -
          mkdir -p /tmp/emrooz
          tar -xJf /tmp/transfer.tar.xz -C /tmp/emrooz

      - name: Patch JVM 17
        shell: bash
        working-directory: /tmp/emrooz
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle.kts')
          s=p.read_text()
          marker='    buildFeatures { compose = true; buildConfig = true }\n'
          patch='''    compileOptions {\n        sourceCompatibility = org.gradle.api.JavaVersion.VERSION_17\n        targetCompatibility = org.gradle.api.JavaVersion.VERSION_17\n    }\n\n'''
          if 'sourceCompatibility = org.gradle.api.JavaVersion.VERSION_17' not in s:
              s=s.replace(marker, patch+marker, 1)
              p.write_text(s)
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run KAPT and print focused failure
        shell: bash
        working-directory: /tmp/emrooz
        run: |
          set +e
          gradle --no-daemon --stacktrace --info :app:kaptDebugKotlin > /tmp/kapt.log 2>&1
          code=$?
          echo '===== FOCUSED KAPT ERRORS ====='
          grep -nEi '(^|[^a-z])(error:|exception|caused by:|room|kapt|cannot|unsupported|illegal|nosuch|failed)' /tmp/kapt.log | tail -n 260 || true
          echo '===== LAST 350 LINES ====='
          tail -n 350 /tmp/kapt.log
          exit $code
